adaptation_objective:
  formula: mean_binary_cross_entropy_plus_half_tether_times_weight_displacement_squared
  warm_start: exact_sealed_BL1_or_BL2_coefficient_and_intercept
  tether_applies_to: coefficient_only
  intercept_tether: none
  sample_weighting: none_target_only
  optimizer: torch_Adam_full_batch_CUDA
  Adam_betas: [0.9, 0.999]
  Adam_eps: 0.00000001
  deterministic_algorithms: true
  SGD_or_other_optimizer: forbidden

adaptation_candidates:
  - config_id: C1_conservative
    learning_rate: 0.003
    steps: 100
    tether_strength: 0.01
    seed: 20260814
    trace_checkpoints: [1, 10, 25, 50, 100]
  - config_id: C2_balanced
    learning_rate: 0.01
    steps: 100
    tether_strength: 0.001
    seed: 20260814
    trace_checkpoints: [1, 10, 25, 50, 100]
  - config_id: C3_aggressive
    learning_rate: 0.03
    steps: 100
    tether_strength: 0.0001
    seed: 20260814
    trace_checkpoints: [1, 10, 25, 50, 100]

calibration:
  family: M2_intercept_only
  fit_split: target_calibration
  frozen_slopes:
    NEW_BL1: 1.194068183024429
    NEW_BL2: 1.0169043468053687
  intercept_regularization: none
  solver: scipy_brentq_score_equation
  bracket: [-50.0, 50.0]
  xtol: 0.000000000001
  rtol: 0.00000000000001
  max_iter: 1000
  refit_after_selection: forbidden

target_BL0:
  source_splits: [target_adaptation_train, target_calibration]
  rows: 19275
  positives: 1558
  probability: 0.08083009079118028
  selection_or_test_labels_may_update_probability: false

selection_rule:
  assessed_split: model_selection
  primary_metric: NEW_BL2_log_loss
  direction: minimize
  simplicity_tie_tolerance_log_loss: 0.0001
  simplicity_order: [C1_conservative, C2_balanced, C3_aggressive]
  eligibility_gates:
    minimum_history_delta_AP: 0.005
    old_AP_noninferiority_margin: 0.005
    maximum_ECE20: 0.03
    maximum_abs_mean_probability_gap: 0.015
  if_no_candidate_eligible: select_same_metric_for_diagnostic_final_replay_but_keep_selection_gate_failed
  selection_labels_may_refit_model_or_calibrator: false
  final_test_can_change_selection: false

statistics:
  primary_population: all_final_temporal_replay_random_exposures
  bootstrap_unit: user
  bootstrap_replicates: 2000
  bootstrap_seed: 20260824
  confidence_interval: paired_percentile_95
  metric_clip: 0.000000000000001
  metrics: [average_precision, roc_auc, log_loss, brier, ECE20_equal_width, user_gauc_event_weighted]
  required_contrasts:
    - NEW_BL1_minus_TARGET_BL0
    - NEW_BL2_minus_NEW_BL1
    - NEW_BL2_minus_OLD_BL2_PLUS_V011

final_gates:
  minimum_history_delta_AP: 0.005
  old_AP_noninferiority_margin: 0.005
  maximum_ECE20: 0.02
  maximum_abs_mean_probability_gap: 0.01
  maximum_extreme_probability_share: 0.05
  minimum_positive_history_AP_days: 2
  maximum_daily_abs_mean_probability_gap: 0.02
  probability_value_rule: at_least_one_of_logloss_or_brier_CI95_upper_below_zero_and_other_point_nonpositive
  all_gates_required_for_retraining_adds_value: true
  failure_engineering_action: retain_frozen_BL2_plus_v011_intercept_calibration

final_temporal_replay_protocol:
  open_only_after_selection_model_and_calibrators_are_hashed: true
  maximum_metric_releases: 1
  retry_after_metric_release: forbidden
  threshold_candidate_or_split_change_after_release: forbidden
  failure_changes_v010_or_v011_conclusion: false

