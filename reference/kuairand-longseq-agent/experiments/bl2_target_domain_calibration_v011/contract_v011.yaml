  calibration_selection: {start: "2022-04-28", end: "2022-05-02", rows: 10544, positives: 872}
  held_out_test: {start: "2022-05-03", end: "2022-05-08", rows: 23752, positives: 2063}

calibration_candidates:
  ordered_families: [M1_prior_shift, M2_intercept_only, M3_platt]
  maximum_candidates: 3
  M1_prior_shift:
    input: logit_p_ADAM_BL2
    source_positives: 70457
    source_rows: 222256
    source_prevalence: 0.31700831473616009
    selection_fit_target_prevalence: 0.078570610468445767
    selection_fit_expected_shift: -1.6943737490338504
    final_refit_target_prevalence: 0.080830090791180281
    final_refit_expected_shift: -1.6635670005029957
  M2_intercept_only:
    input: raw_ADAM_BL2
    frozen_slope: 1.0169043468053687
    intercept_regularization: none
    solver: scipy_brentq_score_equation
    bracket: [-50.0, 50.0]
    xtol: 0.000000000001
    rtol: 0.00000000000001
    max_iter: 1000
  M3_platt:
    input: raw_ADAM_BL2
    implementation: sklearn_LogisticRegression
    solver: lbfgs
    penalty: L2
    C: 1.0
    tol: 0.0000000001
    max_iter: 1000
    required_positive_slope: true
    convergence_warnings_allowed: 0

selection_rule:
  primary_metric: log_loss
  direction: minimize
  ineligible_if: [nonfinite_probability, nonpositive_slope, nonconvergence, stable_order_changed]
  simplicity_tie_tolerance_log_loss: 0.0001
  simplicity_order: [M1_prior_shift, M2_intercept_only, M3_platt]
  selected_family_refit_on_combined_fit_and_selection: true
  test_result_may_change_family: false

final_refit:
  rows: 19275
  positives: 1558
  target_prevalence: 0.080830090791180281
  refit_only_selected_family: true
  must_freeze_parameters_and_hash_before_test: true

statistics:
  primary_population: all_random_exposures_in_held_out_dates
  sensitivity_population: warm_users
  bootstrap_unit: user
  bootstrap_replicates: 2000
  bootstrap_seed: 20260823
  confidence_interval: paired_percentile_95
  metric_clip: 0.000000000000001
  metrics: [log_loss, brier, ECE20_equal_width, average_precision, roc_auc, user_gauc_event_weighted]

gates:
  log_loss_delta_selected_minus_original_point_must_be_negative: true
  log_loss_delta_CI95_upper_must_be_negative: true
  brier_delta_selected_minus_original_point_must_be_negative: true
  brier_delta_CI95_upper_must_be_negative: true
  maximum_ECE20: 0.02
  maximum_absolute_mean_probability_gap: 0.01
  maximum_extreme_probability_share: 0.05
  strict_monotone_increasing_mapping_required: true
  stable_ranking_order_required: true
  ranking_metric_absolute_tolerance: 0.0000000001

held_out_test_protocol:
  open_only_after_selected_family_and_final_parameters_are_hashed: true
  maximum_metric_releases: 1
  retry_after_metric_release: forbidden
  threshold_or_family_change_after_metric_release: forbidden
  failure_changes_v010_history_conclusion: false

