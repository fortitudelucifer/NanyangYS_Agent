convergence:
  base_estimator_required_for_each_fit:
    convergence_warning_count: 0
    n_iter_must_be_strictly_less_than_max_iter: true
    finite_coefficients: true
    finite_intercept: true
    finite_raw_decision_scores: true
    finite_uncalibrated_probabilities: true
  reaching_max_iter:
    interpretation: sklearn_tolerance_stopping_was_not_reached_within_the_frozen_iteration_cap
    status: nonconverged_configuration
    eligible_for_selection: false
    finite_output_does_not_override_nonconvergence: true
    automatic_max_iter_increase: forbidden
  convergence_decision:
    requires_zero_ConvergenceWarning_and_n_iter_strictly_less_than_max_iter: true
    no_manual_visual_override: true
  required_diagnostics:
    - n_iter
    - t_value
    - coefficient_l1_norm
    - coefficient_l2_norm
    - coefficient_absolute_maximum
    - intercept
    - raw_score_min_p001_p01_p10_median_p90_p99_p999_max
    - uncalibrated_probability_distribution
  completed_process_is_not_equal_to_converged_model: true
  failed_or_nonconverged_fit_counts_toward_budget: true
  replacement_with_changed_hyperparameters: forbidden
  stage_specific_failure_semantics:
    search:
      base_estimator_nonconvergence_action: mark_that_model_alpha_eta0_configuration_ineligible_and_continue_the_frozen_search_grid
      primary_calibrator_nonconvergence_action: mark_that_model_alpha_eta0_configuration_ineligible_and_continue_the_frozen_search_grid
      primary_calibrator_nonconvergence_output_semantics:
        precondition: stage_is_search_and_the_trial_is_marked_ineligible_for_primary_calibrator_nonconvergence
        sole_nullable_fields: [calibrated_probability, calibration_intercept, calibration_slope]
        physical_representation: Arrow_null
        NaN_or_infinity_representation: forbidden
        metric_or_selection_consumption: forbidden
        raw_decision_score_and_uncalibrated_probability_if_the_base_estimator_converged: required_finite_and_nonnull
        any_other_probability_parameter_or_stage_nullability: forbidden
      reference_solver_nonconvergence_action: >-
        mark_every_model_alpha_eta0_configuration_depending_on_that_reference_origin_ineligible_and_continue_the_frozen_search_grid
      nonconvergence_is_a_release_stop_condition: false
      all_frozen_trials_must_still_be_attempted_subject_to_the_frozen_budget: true
      terminal_state_if_base_estimator_or_primary_calibrator_nonconvergence_exhausts_the_required_candidate_set: search_component_convergence_failure
      terminal_state_if_reference_solver_nonconvergence_exhausts_the_required_optimization_adequacy_set: search_optimization_adequacy_failure
    frozen_daily:
      base_estimator_nonconvergence_action: fail_closed_immediately
      primary_calibrator_nonconvergence_action: fail_closed_immediately
      reference_solver_nonconvergence_action: fail_closed_immediately
      nonconvergence_is_a_release_stop_condition: true
      terminal_state: frozen_daily_component_convergence_failure
      terminal_exit_code: 10
      partial_daily_metric_aggregation_after_failure: forbidden

optimization_adequacy:
  role: mandatory_solver_health_gate_before_any_candidate_selection
  evaluated_on: estimator_fit_rows_only
  labels_or_metrics_from_calibration_or_assessment_rows: forbidden
  objective_evaluation_dtype: float64
  objective:
    formula: mean_binary_log_loss_from_raw_score_plus_alpha_times_one_half_coefficient_L2_squared
    intercept_regularized: false
    sample_weight: null
    class_weight: null
  reference_pairing_key: [model_id, alpha, origin]
  SGD_pairing_key: [model_id, alpha, eta0, origin]
  reference_must_converge_before_comparison: true
  reference_objective_must_not_exceed_SGD_objective_beyond_numerical_tolerance: true
  reference_above_SGD_numerical_tolerance: 0.0000000001
  maximum_allowed_SGD_objective_regret:
    absolute_floor: 0.0001
    relative_fraction: 0.005
    formula: max(absolute_floor, relative_fraction * abs(reference_objective))
    interpretation: at_most_0_5_percent_relative_regret_with_a_1e_4_absolute_floor
  candidate_eligibility:
    scope: search_phase_candidate_screening
    objective_regret_gate_must_pass_on_all_three_search_origins: true
    failed_origin_action: mark_that_alpha_eta0_model_configuration_ineligible
    no_eligible_BL1_configuration_action: stop_before_metric_based_selection
    no_eligible_primary_shared_pair_action: stop_before_daily_backtest
  frozen_daily_adequacy:
    role: mandatory_fail_closed_gate_on_the_fits_that_produce_the_released_numbers
    rationale: the_seven_daily_fits_generate_pooled_daily_and_bootstrap_results_so_an_unverified_day_contaminates_every_headline_number
    applies_to_all_seven_frozen_daily_origins: true
    scope: selected_shared_pair_id_only
    models: [BL1, BL2]
    reference_source_for_2022_04_11_2022_04_14_2022_04_17: reuse_search_reference_fits_at_the_selected_alpha
    reference_source_for_2022_04_12_2022_04_13_2022_04_15_2022_04_16: eight_additional_frozen_daily_reference_fits
