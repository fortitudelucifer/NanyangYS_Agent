    nonfinite_values: 0
    binary_out_of_domain_values: 0
    transformed_continuous_absolute_maximum: 10.0
    maximum_row_l2_norm: 50.0
    maximum_p99_row_l2_norm: 25.0
    failure_scope: origin_level_shared_preprocessing_object_before_any_hyperparameter_fit
    failure_action: fail_closed_for_the_run_before_any_configuration_uses_the_affected_origin
    marking_only_one_configuration_ineligible: forbidden
  required_numeric_diagnostics:
    - raw_and_transformed_min_p01_median_p99_max_per_numeric_field
    - scaler_mean_scale_and_zero_variance_flags
    - row_l2_norm_p50_p90_p99_p999_max
    - sparse_rows_columns_nonzeros_and_density
    - categorical_observed_and_dedicated_category_count_per_field
    - categorical_infrequent_category_count_and_event_share_per_field
    - categorical_dedicated_event_coverage_per_field
    - categorical_unknown_share_per_field_and_split

models:
