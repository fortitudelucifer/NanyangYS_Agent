    eta0_values: [0.001, 0.01]
    parameter_grid: cartesian_product
    configurations_per_model: 4
    max_iter: 100
    tol: 0.0001
    n_iter_no_change: 5
    shuffle: true
    verbose: 0
    epsilon_inactive_but_explicit: 0.1
    random_state: 20260814
    early_stopping: false
    early_stopping_reason: sklearn_random_validation_holdout_is_not_the_frozen_temporal_calibration_protocol
    validation_fraction_inactive: 0.1
    average: true
    class_weight: null
    warm_start: false
    n_jobs: 1
    power_t_inactive_but_explicit: 0.5
    eta0_and_alpha_are_independently_varied: true
    inherited_optimizer_defaults: forbidden
    excluded_predecessor_alpha_values: [0.000001, 0.00001]
    excluded_predecessor_alpha_reason: associated_with_extreme_coefficient_norms_and_probability_saturation_under_the_v002_optimal_schedule
    grid_change_rationale:
      alpha: remove_the_two_weakest_regularization_values_implicated_by_v002_saturation_and_add_one_stronger_value
      eta0: explicitly_bound_the_learning_rate_that_v002_left_coupled_to_alpha_through_the_optimal_schedule
      design: two_by_two_factorial_separates_regularization_strength_from_initial_step_size
      scientific_feature_hypothesis_expanded: false
      optimizer_repair_search_space_expanded: true
  diagnostic_reference_solver:
    role: optimization_adequacy_reference_for_the_same_L2_logistic_objective
    implementation: sklearn_LogisticRegression
    sklearn_version_required: 1.9.0
    solver: lbfgs
    penalty_argument_must_be_omitted: true
    expected_get_params_penalty_sentinel: deprecated
    l1_ratio: 0.0
    C_per_origin_and_alpha: 1_divided_by_estimator_fit_rows_times_alpha
    objective_equivalence:
      SGDClassifier_normalized: mean_log_loss_plus_alpha_times_one_half_coefficient_L2_squared
      LogisticRegression_normalized: mean_log_loss_plus_one_half_coefficient_L2_squared_divided_by_estimator_fit_rows_times_C
      LogisticRegression_solver_scaled_equivalent: C_times_sum_log_loss_plus_one_half_coefficient_L2_squared
      solver_scaled_and_normalized_forms_have_the_same_minimizer: true
      sample_weight: null
      class_weight: null
      intercept_regularized: false
      exact_mapping_required: C_equals_1_divided_by_estimator_fit_rows_times_alpha
      mapping_derivation: one_divided_by_estimator_fit_rows_times_C_equals_alpha
    alpha_values: [0.0001, 0.001]
    eta0_applicable: false
    model_bundles: [BL1, BL2]
    search_origins: ["2022-04-11", "2022-04-14", "2022-04-17"]
    search_alpha_scope: all_declared_alpha_values
    search_fit_runs: 12
    frozen_daily_origins: ["2022-04-12", "2022-04-13", "2022-04-15", "2022-04-16"]
    frozen_daily_alpha_scope: selected_shared_pair_alpha_only
    frozen_daily_model_bundles: [BL1, BL2]
    frozen_daily_fit_runs: 8
    frozen_daily_search_origin_reuse: reuse_the_search_reference_fits_at_the_selected_alpha_for_2022_04_11_2022_04_14_and_2022_04_17
    frozen_daily_runs_after_primary_shared_configuration_selection: true
    frozen_daily_may_change_selection_or_hyperparameters: false
    frozen_daily_may_be_used_for_model_selection: false
    total_fit_runs: 20
    total_fit_runs_formula: 12_search_plus_8_frozen_daily
    input_matrix_values_and_column_order_identical_to_SGD: true
    input_dtype: float64
    sparse_input_format: CSR
    fit_intercept: true
    dual: false
    intercept_scaling: 1
    class_weight: null
    random_state: null
    max_iter: 500
    tol: 0.00000001
    verbose: 0
    warm_start: false
    n_jobs: null
    convergence_warning_count: 0
    n_iter_must_be_strictly_less_than_max_iter: true
    calibration: none
    eligible_for_model_selection: false
    eligible_for_primary_or_secondary_prediction_claim: false
    assessment_metrics_role: optimization_diagnostic_only
    budget_failure_action: stop_before_search_metric_materialization
    search_nonconvergence_action: >-
      mark_every_model_alpha_eta0_configuration_depending_on_that_reference_origin_ineligible_and_continue_the_frozen_search_grid
    frozen_daily_nonconvergence_action: fail_closed_immediately_to_frozen_daily_component_convergence_failure_exit_10_before_any_daily_metric_aggregation
  BL1:
    role: repaired_static_no_history_probability_baseline
    bundle: S_ID_CONTENT_V1_with_PIT_GROUPED_SCALE_V2
    estimator: shared_sparse_linear_estimator
  BL2:
    role: repaired_strict_user_history_probability_candidate
    bundle: H2_USER_STRICT_V1_with_PIT_GROUPED_SCALE_V2
    estimator: shared_sparse_linear_estimator
  fixed_nonfitted_history_diagnostics:
    LIFETIME_SMOOTHED_RATE:
      score_formula: (prior_positive_n + 20.0 * estimator_fit_prevalence) / (prior_event_n + 20.0)
      numerator: prior_positive_n_plus_20_times_estimator_fit_prevalence
      denominator: prior_event_n_plus_20
      source_fields: [prior_event_n, prior_positive_n]
    W10_SMOOTHED_RATE:
      score_formula: (w10_positive_n + 20.0 * estimator_fit_prevalence) / (w10_event_n + 20.0)
      numerator: w10_positive_n_plus_20_times_estimator_fit_prevalence
      denominator: w10_event_n_plus_20
      source_fields: [w10_event_n, w10_positive_n]
    common_rules:
      estimator_fit_prevalence_uses_only_estimator_fit_rows: true
      calibration: none
      fitted_parameters: none
      role: ranking_diagnostic_only
      eligible_for_model_selection: false
      pass_fail_gate: none
      hard_ROC_AUC_threshold: forbidden
      metrics: [average_precision, roc_auc, user_gauc_event_weighted, user_gauc_user_equal]
      search_stage_evaluations: 6
      frozen_daily_stage_evaluations: 14
      total_evaluations: 20
      evaluation_definition: one_rule_score_vector_for_one_per_origin_assessment_row_set
      search_per_origin_rows: 6
      search_pooled_rows: 2
      frozen_daily_per_origin_rows: 14
      frozen_daily_pooled_rows: 2
      pooled_rows_are_aggregations_of_already_frozen_per_origin_score_vectors: true
      pooled_rows_count_as_additional_rule_evaluations: false
      total_report_rows_if_both_stages_complete: 24
      overlapping_search_and_daily_origin_scores_must_match_exactly: true
      metrics_required_per_origin_and_pooled: true
      final_combined_artifact_must_compare_each_per_origin_and_pooled_rule_row_to_primary_BL2: true
