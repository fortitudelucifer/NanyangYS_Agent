    - origin_or_pooled
    - diagnostic_id
    - rows
    - users
    - prevalence
    - average_precision
    - roc_auc
    - user_gauc_event_weighted
    - user_gauc_user_equal
    - primary_BL2_pair_id
    - primary_BL2_average_precision
    - primary_BL2_roc_auc
    - primary_BL2_user_gauc_event_weighted
    - primary_BL2_user_gauc_user_equal
    - diagnostic_minus_primary_BL2_average_precision
    - diagnostic_minus_primary_BL2_roc_auc
    - diagnostic_minus_primary_BL2_user_gauc_event_weighted
    - diagnostic_minus_primary_BL2_user_gauc_user_equal
  fixed_history_rule_scope_semantics:
    per_origin: evaluate_the_frozen_rule_and_primary_BL2_on_identical_origin_rows
    pooled: concatenate_the_already_frozen_per_origin_rule_scores_labels_users_and_primary_BL2_probabilities_then_compute_once
    cross_origin_average_of_metrics_as_pooled_value: forbidden
  paired_user_cluster_bootstrap_required_fields:
    - comparison_id
    - metric
    - point_estimate
    - replicate_count
    - seed
    - CI_lower
    - CI_upper
    - eligible_users
    - eligible_rows
  runtime_preflight_required_fields:
    - designated_component_ids
    - observed_seconds_by_component_type
    - observed_peak_RAM_GB
    - observed_artifact_GB
    - safety_multiplier
    - projected_total_elapsed_minutes
    - projected_peak_RAM_GB
    - projected_artifact_GB
    - observed_thread_pools_by_designated_fit_run_id
    - all_designated_fit_threadpool_limits_passed
    - passed
    - stop_reason
  terminal_state:
    filename: terminal_state.json
    required_fields:
      - run_id
      - state
      - exit_code
      - stage
      - message
      - contract_sha256
      - active_release_started
      - completion_scope
      - fit_operations
      - fit_operations_by_type
      - fit_operations_by_stage
    state_must_be_a_key_in_terminal_state_registry: true
    exit_code_must_exactly_match_terminal_state_registry: true
    completion_scope_values: [full, partial_failure]
  run_manifest:
    filename: run_manifest.json
    required_fields:
      - run_id
      - contract_sha256
      - terminal_state
      - exit_code
      - completion_scope
      - inherited_upstream_guarantees
      - environment
      - code_sha256
      - get_params_snapshots
      - threadpool_control
      - artifact_inventory
      - artifact_hash_manifest
    terminal_state_and_exit_code_must_match_terminal_state_json: true
    full_completion_artifact_inventory:
      entry_required_fields: [path, size_bytes, sha256]
      coverage: required_outputs_artifacts_excluding_run_manifest_and_artifact_hash_manifest
      expected_entry_count: 34
      all_entries_must_have_been_generated_or_atomically_replaced_by_this_run_id: true
    partial_failure_artifact_inventory:
      coverage: every_current_run_artifact_present_before_run_manifest_except_run_manifest_and_artifact_hash_manifest
      stale_preexisting_artifacts_may_not_be_listed: true
    partial_failure_get_params_snapshots:
      preserve_every_component_snapshot_available_before_failure: true
      preserve_every_executed_assessment_calibration_regression_snapshot: true
      omission_of_an_executed_assessment_calibration_regression_snapshot: forbidden
    threadpool_control:
      required_fields:
        - threadpoolctl_version
        - hard_limits_by_fit_type
        - per_fit_observations
        - all_observed_pools_within_limit
      per_fit_observation_required_fields:
        - fit_run_id
        - fit_type
        - stage
        - threadpool_limit
        - observed_thread_pools_before_fit
        - observed_thread_pools_after_fit
        - maximum_observed_pool_threads
        - threadpool_limit_passed
      every_executed_fit_run_id_must_appear_exactly_once: true
      values_must_match_the_corresponding_fit_and_usage_ledgers_exactly: true
      preserve_completed_fit_observations_in_partial_failure_manifest: true
  artifact_hash_manifest:
    filename: artifact_hash_manifest.json
    format: JSON
    hash_algorithm: SHA-256
    top_level_required_fields:
      - run_id
      - completion_scope
      - hash_algorithm
      - self_hash_status
      - required_artifact_count
      - artifact_count
      - missing_required_artifacts
      - artifacts
    artifact_entry_required_fields: [path, size_bytes, sha256]
    path_uniqueness_required: true
    size_bytes_must_be_positive: true
    sha256_format: lowercase_64_hexadecimal_characters
    full_completion_coverage: every_other_entry_in_required_outputs_artifacts
    full_completion_expected_required_artifact_count: 36
    full_completion_expected_artifact_count: 35
    full_completion_missing_required_artifacts: []
    partial_failure_coverage: every_artifact_generated_or_atomically_replaced_by_the_current_active_run_except_this_manifest
    partial_failure_missing_required_artifacts_must_be_listed: true
    self_hash_status: excluded_to_avoid_self_reference
    final_recomputation_must_exactly_match_every_entry: true
    missing_empty_or_hash_mismatched_artifact_action: fail_before_any_complete_release_state

required_outputs:
  output_directory: reports/generated/gate2b_probability_repair_v003
  artifacts:
    - contract_snapshot.yaml
    - input_verification.json
    - target_row_manifests.csv
    - temporal_split_manifest.csv
    - preprocessing_manifest.json
    - numeric_scaling_audit.csv
    - categorical_frequency_audit.csv
    - runtime_preflight.json
    - search_artifact_freeze_manifest.json
    - search_fixed_history_rule_diagnostics.csv
    - search_trial_manifest.csv
    - convergence_ledger.csv
    - reference_solver_ledger.csv
    - optimization_objective_audit.csv
    - calibration_fit_ledger.csv
    - usage_ledger.csv
    - search_predictions_origin_2022-04-11.parquet
    - search_predictions_origin_2022-04-14.parquet
    - search_predictions_origin_2022-04-17.parquet
    - search_metrics.csv
    - paired_configuration_metrics.csv
    - fixed_history_rule_diagnostics.csv
    - selected_models.json
    - selected_primary_shared_configuration.json
    - daily_predictions.parquet
    - daily_metrics.csv
    - pooled_and_slice_metrics.csv
    - probability_distribution_audit.csv
    - calibration_bins.csv
    - calibration_intercept_slope.csv
    - paired_user_cluster_bootstrap.csv
    - terminal_state.json
    - run_manifest.json
    - artifact_hash_manifest.json
    - reports/analysis/gate2b_probability_repair_results_v003.md
    - reports/figures/gate2b_probability_repair_results_v003.png
  current_run_generation_policy:
    one_unique_run_id_required: true
    every_counted_artifact_must_be_generated_or_atomically_replaced_during_that_run_id: true
    a_preexisting_file_with_a_matching_name_or_hash_cannot_satisfy_current_run_completeness: true
    produced_path_registry_must_be_in_memory_until_manifest_finalization: true
  lifecycle_policy:
    pre_execution_nonrun_operation_or_refusal:
      applies_before_active_release_boundary:
        - validate_only_success_or_failure
        - missing_or_false_execution_authorization
        - approved_contract_hash_mismatch
        - required_precondition_not_satisfied
        - implementation_SHA256_mismatch
        - environment_version_mismatch
        - input_path_size_or_SHA256_mismatch
      artifact_behavior: return_or_refuse_without_creating_replacing_or_deleting_any_run_artifact
      terminal_state_artifact: forbidden
      run_manifest_artifact: forbidden
      artifact_hash_manifest_artifact: forbidden
    active_release_boundary:
      starts_only_after_all_pre_execution_contract_authorization_implementation_environment_and_input_checks_pass: true
      run_id_must_be_committed_at_boundary: true
    active_release_failure:
      required_completion_scope: partial_failure
      required_governance_artifacts:
        - terminal_state.json
        - run_manifest.json
        - artifact_hash_manifest.json
        - usage_ledger.csv
      include_all_current_run_checkpoints_and_ledgers_that_exist: true
      hash_every_current_run_artifact_except_artifact_hash_manifest_itself: true
      list_every_missing_full_required_artifact: true
      may_not_claim_all_required_artifacts_complete: true
    full_completion:
      states:
        - pass
        - absolute_probability_fail
        - absolute_probability_pass_but_relative_history_fail
      all_36_required_artifacts_must_exist_and_belong_to_this_run_id: true
      run_manifest_inventory_entry_count: 34
      artifact_hash_manifest_entry_count: 35
      all_budget_resource_schema_identity_and_hash_checks_must_finish_before_completion_is_committed: true
      terminal_state_may_be_written_provisionally_but_is_not_complete_until_both_manifests_verify: true
      after_completion_commit_no_operation_that_can_change_artifacts_or_raise_a_release_failure_is_allowed: true

release_stop_conditions:
  - contract_not_explicitly_approved_for_execution
  - contract_or_input_SHA256_mismatch
  - environment_version_mismatch
  - canonical_count_or_identity_mismatch
  - undeclared_input_access
  - predecessor_prediction_used_for_fit_calibration_or_selection
  - estimator_calibration_or_assessment_date_overlap
  - calibration_assessment_date_overlap
  - preprocessing_numeric_hard_check_failure
  - nonfinite_feature_coefficient_intercept_score_or_probability
  - frozen_daily_base_estimator_reference_solver_or_calibrator_nonconvergence
  - reference_solver_objective_mapping_failure
  - frozen_daily_optimization_adequacy_failure_on_any_of_the_seven_origins
  - frozen_daily_origin_exclusion_or_reweighting_after_an_adequacy_failure
  - runtime_preflight_failure
  - calibrated_probability_order_not_monotone_with_raw_score
  - paired_configuration_or_prediction_identity_label_mismatch
  - primary_BL1_BL2_alpha_or_eta0_mismatch
  - fit_or_resource_budget_breach
  - threadpool_limit_or_observation_failure
  - search_grid_or_metric_read_order_violation

release_stop_condition_scoping:
  threadpool_limit_or_observation_failure:
    applies_to: every_search_frozen_daily_primary_reference_calibrator_and_assessment_diagnostic_fit
    action: fail_closed_and_forbid_the_affected_fit_output_from_any_scientific_use
    terminal_state_after_active_release_boundary: implementation_or_governance_failure
  search_configuration_objective_inadequacy:
    per_configuration_action: mark_ineligible_and_continue_the_complete_frozen_grid
    global_stop_only_if_no_required_optimization_adequate_configuration_remains: true
    terminal_state_if_exhausted: search_optimization_adequacy_failure
  search_reference_solver_nonconvergence:
    per_dependent_configuration_action: mark_ineligible_and_continue_the_complete_frozen_grid
    terminal_state_if_required_optimization_adequacy_set_is_exhausted: search_optimization_adequacy_failure
  frozen_daily_objective_inadequacy:
    action: fail_closed_before_metric_aggregation
    terminal_state: frozen_daily_optimization_adequacy_failure
  frozen_daily_component_nonconvergence:
    components: [base_estimator, reference_solver, primary_calibrator]
    action: fail_closed_before_metric_aggregation
    terminal_state: frozen_daily_component_convergence_failure

terminal_state_registry:
  pass:
    exit_code: 0
    completion_scope: full
    scientific_role: final_gate_success
  implementation_or_governance_failure:
    exit_code: 2
    completion_scope: partial_failure
    pre_active_release_refusal_creates_no_terminal_state_artifact: true
    scientific_role: no_scientific_decision
  absolute_probability_fail:
    exit_code: 3
    completion_scope: full
    scientific_role: final_absolute_probability_gate_failure
  absolute_probability_pass_but_relative_history_fail:
    exit_code: 4
    completion_scope: full
    scientific_role: final_relative_history_gate_failure_after_absolute_probability_pass
  search_optimization_adequacy_failure:
    exit_code: 5
    completion_scope: partial_failure
    scientific_role: no_search_configuration_meets_the_registered_objective_adequacy_requirement
    includes_exhaustion_caused_by_search_reference_solver_nonconvergence: true
  frozen_daily_optimization_adequacy_failure:
    exit_code: 6
    completion_scope: partial_failure
    scientific_role: all_components_converged_but_a_selected_frozen_daily_fit_fails_the_objective_adequacy_gate
  search_probability_quality_failure:
    exit_code: 7
    completion_scope: partial_failure
    scientific_role: optimization_and_component_eligible_BL1_configurations_exist_but_none_passes_the_search_absolute_probability_gate
  search_primary_pair_gate_failure:
    exit_code: 8
    completion_scope: partial_failure
    scientific_role: the_BL1_selected_same_configuration_BL2_is_component_and_optimization_eligible_but_fails_the_registered_primary_BL2_search_gate
  search_component_convergence_failure:
    exit_code: 9
    completion_scope: partial_failure
    scientific_role: required_search_candidates_are_exhausted_by_base_estimator_or_primary_calibrator_nonconvergence
  frozen_daily_component_convergence_failure:
    exit_code: 10
    completion_scope: partial_failure
    scientific_role: frozen_daily_base_estimator_reference_solver_or_primary_calibrator_nonconvergence
scientific_annotation_registry:
  annotation_only_not_terminal_states:
    - case_A_static_baseline_is_informative
    - case_B_static_baseline_is_uninformative_with_adequate_fit
    - case_B2_static_baseline_is_significantly_worse_with_adequate_fit
  may_not_appear_as_terminal_state_json_state: true

final_decision_states:
  pass:
    requirements:
      - reference_solver_and_all_selected_SGD_optimization_adequacy_gates_pass
      - frozen_daily_optimization_adequacy_passes_on_all_seven_origins
      - all_absolute_BL0_probability_quality_gates_pass
      - same_alpha_eta0_primary_BL2_over_BL1_history_gate_passes
      - all_required_artifacts_complete_and_hashed
    advancement_effect: eligible_to_request_separate_Gold_and_next_stage_approval_only
    automatic_Gold_sequence_or_validation_authorization: false
  absolute_probability_pass_but_relative_history_fail:
    interpretation: probability_pipeline_repaired_but_v003_does_not_retain_the_history_increment
    advancement_effect: stop_and_review_at_baseline_layer
  absolute_probability_fail:
    interpretation: probability_pipeline_remains_unfit
    advancement_effect: stop_at_baseline_layer
  frozen_daily_optimization_adequacy_failure:
    interpretation: the_selected_configuration_components_converge_but_objective_adequacy_does_not_hold_on_every_frozen_daily_origin
    scientific_conclusion: none
    advancement_effect: stop_before_metric_aggregation_and_require_a_successor_contract
  search_optimization_adequacy_failure:
    interpretation: no_optimization_adequate_BL1_configuration_or_no_optimization_adequate_primary_shared_pair_remains_due_to_objective_regret_or_reference_solver_nonconvergence
    scientific_conclusion: none
    excludes_probability_quality_only_ineligibility: true
    advancement_effect: stop_before_daily_backtest_and_require_a_successor_contract
  search_probability_quality_failure:
    interpretation: search_optimization_and_component_eligibility_exists_but_no_BL1_configuration_passes_the_absolute_probability_search_gate
    scientific_conclusion: the_frozen_search_probability_repair_gate_failed
    advancement_effect: stop_before_daily_backtest
  search_primary_pair_gate_failure:
    interpretation: the_BL1_selected_same_configuration_BL2_fails_the_registered_primary_search_gate_after_component_and_optimization_eligibility
    scientific_conclusion: no_valid_primary_same_configuration_history_increment_pipeline_for_daily_backtest
    advancement_effect: stop_before_daily_backtest
  search_component_convergence_failure:
    interpretation: the_required_search_candidate_set_is_exhausted_by_base_estimator_or_primary_calibrator_nonconvergence
    scientific_conclusion: none
    advancement_effect: stop_before_daily_backtest_and_require_a_successor_contract
  frozen_daily_component_convergence_failure:
    interpretation: a_selected_frozen_daily_base_estimator_reference_solver_or_primary_calibrator_does_not_converge
    scientific_conclusion: none
    advancement_effect: stop_before_daily_metric_aggregation_and_require_a_successor_contract
  implementation_or_governance_failure:
    interpretation: no_scientific_gate_decision
    advancement_effect: fix_under_a_versioned_or_exact_infrastructure_replacement_rule

preregistered_outcome_interpretation:
  registered_before_any_v003_fit_or_scientific_metric_read: true
  registered_in: design_revision_002
  post_hoc_reinterpretation_of_these_states: forbidden
  layer_mapping:
    revision_002_four_outcome_phrase_means: four_scientific_interpretation_families_A_through_D_not_four_exhaustive_process_exit_codes
    case_A_case_B_and_case_B2:
      role: secondary_static_baseline_discrimination_annotation
      may_annotate_final_decision_states:
        - pass
        - absolute_probability_pass_but_relative_history_fail
        - absolute_probability_fail
      does_not_by_itself_choose_a_terminal_state: true
    case_C_search_optimization_adequacy_failure:
      maps_to_final_decision_state: search_optimization_adequacy_failure
      reference_solver_nonconvergence_is_within_the_case_C_search_adequacy_family: true
    search_component_convergence_failure:
      scientific_interpretation_family: none
      reason: the_registered_search_model_or_calibration_pipeline_did_not_leave_a_complete_candidate_set
    case_D_frozen_daily_optimization_adequacy_failure:
      maps_to_final_decision_state: frozen_daily_optimization_adequacy_failure
    frozen_daily_component_convergence_failure:
      scientific_interpretation_family: none
      reason: no_complete_seven_day_probability_or_history_result_exists
    implementation_or_governance_failure:
      scientific_interpretation_family: none
      reason: no_scientific_gate_decision_is_valid
  case_A_static_baseline_is_informative:
    trigger:
      all_optimization_adequacy_gates_pass: true
      BL1_minus_BL0_average_precision_direction: positive_with_bootstrap_CI_lower_above_zero
    meaning: the_static_identity_and_content_features_carry_marginal_ranking_signal
    permitted_claim: strict_user_history_adds_an_increment_on_top_of_an_effective_static_baseline
    permitted_delta_wording: increment_over_static_baseline
  case_B_static_baseline_is_uninformative_with_adequate_fit:
    trigger:
      all_optimization_adequacy_gates_pass: true
      BL1_minus_BL0_average_precision_bootstrap_CI_includes_zero: true
    meaning: the_fit_is_verified_adequate_and_the_static_one_hot_features_carry_no_marginal_ranking_signal_at_this_capacity
    status: scientific_finding_not_a_defect
    permitted_claim: under_this_specification_strict_user_history_is_the_principal_effective_information_source
    forbidden_claim: increment_on_top_of_an_effective_static_baseline
    forbidden_action:
      - reopen_the_optimizer_search_on_the_basis_of_this_outcome
      - expand_the_hyperparameter_grid_on_the_basis_of_this_outcome
      - relax_the_objective_regret_tolerance_on_the_basis_of_this_outcome
      - reclassify_this_outcome_as_an_implementation_failure
    required_disclosure: BL1_minus_BL0_point_estimates_and_paired_user_cluster_bootstrap_intervals
  case_B2_static_baseline_is_significantly_worse_with_adequate_fit:
    interpretation_family: B
    trigger:
      all_optimization_adequacy_gates_pass: true
      BL1_minus_BL0_average_precision_bootstrap_CI_upper_strictly_below_zero: true
    meaning: the_static_one_hot_pipeline_is_significantly_worse_than_BL0_under_this_frozen_training_and_calibration_protocol
    status: scientific_finding_distinct_from_no_detectable_increment
    permitted_claim: the_frozen_static_pipeline_is_harmful_relative_to_BL0_under_this_specification
    forbidden_claim:
      - the_static_bundle_is_merely_not_distinguishable_from_BL0
      - increment_on_top_of_an_effective_static_baseline
    required_disclosure: BL1_minus_BL0_point_estimates_and_paired_user_cluster_bootstrap_intervals
  case_C_search_optimization_adequacy_failure:
    trigger:
      no_required_search_configuration_remains_because_the_objective_regret_gate_or_reference_solver_convergence_requirement_failed: true
      base_estimator_or_primary_calibrator_nonconvergence_only_maps_to_search_component_convergence_failure: true
      probability_quality_only_ineligibility_does_not_trigger_case_C: true
    meaning: the_required_SGD_objective_and_reference_optimization_adequacy_could_not_be_established_within_the_frozen_envelope
    reference_solver_nonconvergence_is_in_scope: true
    scientific_conclusion: none
    permitted_next_step: successor_contract_with_a_declared_optimizer_change
  case_D_frozen_daily_optimization_adequacy_failure:
    trigger:
      search_phase_adequacy_passed: true
      any_of_the_seven_frozen_daily_origins_fails_the_regret_gate: true
    meaning: the_frozen_configuration_does_not_transfer_across_all_daily_refits
    scientific_conclusion: none
    forbidden_action:
      - exclude_the_failing_day_and_reaggregate
      - reweight_days_to_recover_a_pooled_result
      - report_pooled_daily_or_bootstrap_results_from_a_partially_adequate_seven_day_set
    permitted_next_step: successor_contract_with_a_declared_optimizer_or_protocol_change

claim_boundary:
  permitted_if_passed:
    - posthoc_train_only_probability_baseline_repair_under_the_v003_contract
    - strict_user_history_retains_a_train_only_ranking_increment_at_the_same_alpha_eta0_if_the_primary_relative_gate_passes
  required_disclosures:
    - v003_was_designed_after_v002_metrics_were_observed
    - all_v003_dates_are_developmental_source_train_dates
    - probability_calibration_uses_the_previous_completed_train_date
    - BL1_minus_BL0_discrimination_estimate_and_CI_whether_or_not_positive
    - reference_solver_objective_gap_and_assessment_diagnostics
    - all_four_same_configuration_BL2_minus_BL1_search_deltas
    - fixed_lifetime_and_w10_rule_diagnostics
  forbidden:
    - use_secondary_independently_optimized_comparison_as_the_primary_H2_claim
    - claim_BL1_static_discrimination_superiority_without_positive_paired_CI
    - use_a_posthoc_ROC_AUC_0_70_threshold_as_a_gate
    - preregistered_v002_probability_success_claim
    - independent_confirmation_claim
    - validation_generalization_claim
    - restricted_test_or_random_performance_claim
    - causal_or_online_business_lift_claim
    - Gold_dataset_claim
    - sequence_or_long_sequence_model_claim
