    derived_metrics_may_read_only_the_frozen_identity_label_user_and_fixed_rule_score_columns: true
    preselection_search_metric_artifact_contains_rule_only_metrics_without_primary_BL2_comparison: true
    primary_BL2_comparison_is_joined_only_after_BL1_selection_and_primary_BL2_gate_into: fixed_history_rule_diagnostics.csv
  trial_counts:
    BL1_SGD_configurations: 4
    BL2_SGD_configurations: 4
    total_scientific_SGD_configurations: 8
    origins_per_configuration: 3
    SGD_base_estimator_fit_runs: 24
    primary_calibrator_fit_runs: 24
    diagnostic_reference_solver_fit_runs: 12
    nonfitted_history_rule_evaluations: 6
    total_search_fit_operations: 60
  paired_configuration_registry:
    pairing_key: [alpha, eta0]
    configurations:
      - {pair_id: A1em04_E1em03, alpha: 0.0001, eta0: 0.001}
      - {pair_id: A1em04_E1em02, alpha: 0.0001, eta0: 0.01}
      - {pair_id: A1em03_E1em03, alpha: 0.001, eta0: 0.001}
      - {pair_id: A1em03_E1em02, alpha: 0.001, eta0: 0.01}
    BL1_and_BL2_must_both_exist_for_every_pair_and_origin: true
    missing_or_mismatched_pair_action: stop_before_metric_materialization
  BL1_shared_configuration_eligibility:
    all_three_SGD_fits_converged: true
    all_three_optimization_adequacy_gates_pass: true
    all_three_calibrators_converged: true
    pooled_calibrated_log_loss_minus_BL0_must_be_nonpositive: true
    pooled_calibrated_brier_minus_BL0_must_be_nonpositive: true
    minimum_nonworse_log_loss_origins: 2
    minimum_nonworse_brier_origins: 2
    total_origins: 3
    nonworse_baseline: same_origin_BL0
    pooled_baseline_origin_count_role: reported_diagnostic_not_a_gate
  primary_shared_configuration_selection:
    selection_uses_only_BL1_metrics_and_parameters: true
    BL2_metrics_or_deltas_used_for_selection: forbidden
    rationale: select_a_probability_safe_static_configuration_before_measuring_the_increment_from_adding_history
    order_semantics: at_each_metric_key_retain_all_configurations_within_tolerance_then_apply_the_next_key
    floating_metric_tie_tolerance: 0.0000000001
    alpha_and_eta0_ties_use_exact_decimal_values: true
    final_deterministic_fallback: ascending_pair_id
    order:
      - minimum_BL1_pooled_calibrated_log_loss
      - minimum_BL1_pooled_calibrated_brier
      - maximum_BL1_pooled_calibrated_average_precision
      - maximum_BL1_pooled_calibrated_user_gauc_event_weighted
      - larger_alpha
      - smaller_eta0
    output: one_frozen_pair_id_shared_by_BL1_and_BL2
    no_eligible_BL1_configuration_action: stop_before_primary_BL2_gate_and_daily_backtest
  primary_BL2_same_configuration_eligibility:
    alpha_and_eta0_must_equal_selected_BL1: true
    all_three_SGD_fits_converged: true
    all_three_optimization_adequacy_gates_pass: true
    all_three_calibrators_converged: true
    pooled_calibrated_log_loss_minus_BL0_must_be_nonpositive: true
    pooled_calibrated_brier_minus_BL0_must_be_nonpositive: true
    minimum_nonworse_log_loss_origins_vs_BL0: 2
    minimum_nonworse_brier_origins_vs_BL0: 2
    pooled_calibrated_average_precision_minus_paired_BL1_must_be_positive: true
    pooled_calibrated_user_gauc_minus_paired_BL1_must_be_nonnegative: true
    pooled_calibrated_log_loss_minus_paired_BL1_must_be_nonpositive: true
    pooled_calibrated_brier_minus_paired_BL1_must_be_nonpositive: true
    minimum_positive_average_precision_origins_vs_paired_BL1: 2
    total_origins: 3
    failure_action: stop_before_daily_backtest
  all_pair_sensitivity_report:
    all_four_pairwise_BL2_minus_BL1_deltas_required: true
    metrics: [average_precision, user_gauc_event_weighted, log_loss, brier]
    per_origin_and_pooled: true
    minimum_or_all_pairs_positive_gate: none
    role: optimizer_configuration_robustness_diagnostic
    configuration_count_disclosure:
      eligible_configuration_count_required_in_selected_models_json: true
      paired_configuration_count_used_by_this_diagnostic_required_in_main_report: true
      count_definition: pairs_with_complete_eligible_BL1_and_BL2_metrics_for_the_reported_scope
      if_fewer_than_four_pairs: explicitly_state_that_the_robustness_diagnostic_uses_fewer_than_the_four_frozen_pairs
      if_exactly_one_pair_required_exact_disclosure: cross_optimizer_configuration_robustness_cannot_be_assessed
      ineligible_pair_ids_and_reasons_required: true
  secondary_independently_optimized_pipeline_comparison:
    allowed: true
    BL1_selection: reuse_primary_shared_configuration_BL1
    BL2_selection_order_semantics: at_each_metric_key_retain_all_configurations_within_1e_minus_10_then_apply_the_next_key
    BL2_final_deterministic_fallback: ascending_pair_id
    BL2_selection_order:
      - maximum_pooled_calibrated_average_precision_among_absolute_safe_and_optimization_adequate_candidates
      - maximum_pooled_calibrated_user_gauc_event_weighted
      - minimum_pooled_calibrated_log_loss
      - minimum_pooled_calibrated_brier
      - larger_alpha
      - smaller_eta0
    role: engineering_diagnostic_only
    may_change_primary_shared_configuration: false
    may_support_primary_H2_claim: false
    may_override_primary_gate_failure: false
    receives_seven_day_refit: false
  frozen_daily_backtest:
    origins: ["2022-04-11", "2022-04-12", "2022-04-13", "2022-04-14", "2022-04-15", "2022-04-16", "2022-04-17"]
    models: [BL1, BL2]
    shared_pair_id_required: true
    alpha_and_eta0_identical_between_BL1_and_BL2: true
    base_estimator_fit_runs: 14
    calibrator_fit_runs: 14
    reference_solver_fit_runs: 8
    reference_solver_scope: selected_shared_pair_alpha_only
    reference_solver_origins: ["2022-04-12", "2022-04-13", "2022-04-15", "2022-04-16"]
    reference_solver_reused_search_origins: ["2022-04-11", "2022-04-14", "2022-04-17"]
    optimization_adequacy_required_on_every_origin: true
    frozen_daily_phase_order:
      - fit_all_seven_origin_BL1_and_BL2_SGD_estimators_at_the_selected_pair_id
      - fit_the_eight_additional_frozen_daily_reference_solvers
      - evaluate_frozen_daily_optimization_adequacy_on_all_seven_origins
      - if_any_origin_fails_stop_before_metric_aggregation
      - only_then_fit_calibrators_and_materialize_daily_predictions_and_metrics
    hyperparameter_changes: forbidden
    preprocessing_changes: forbidden
    calibration_changes: forbidden

probability_quality_gate:
  role: mandatory_absolute_sanity_not_descriptive
  scientific_noninferiority_margin:
    log_loss: 0.0
    brier: 0.0
  numerical_comparison_tolerance: 0.0000000001
  required_for_each_of: [BL1, BL2]
  pooled_requirements:
    calibrated_log_loss_minus_BL0_must_be_nonpositive: true
    calibrated_brier_minus_BL0_must_be_nonpositive: true
  daily_stability_requirements:
    minimum_nonworse_log_loss_days: 5
    minimum_nonworse_brier_days: 5
    total_days: 7
    nonworse_baseline: same_day_BL0
    nonworse_baseline_rationale: >-
      pooled_requirements already states the pooled-BL0 comparison, so the
      separately declared daily block is per day in both the metric and the
      baseline; each day is judged against its own BL0
    pooled_baseline_day_count_role: reported_diagnostic_not_a_gate
  probability_sanity_failure_action:
    - mark_gate2b_probability_repair_failed
    - stop_at_baseline_layer
    - forbid_sequence_model_submission
    - forbid_validation_access_request_based_on_this_run
  not_sufficient_alone_for_advancement: true

relative_history_gate:
  comparison: frozen_BL2_minus_frozen_BL1_at_the_same_primary_shared_pair_id
  alpha_and_eta0_identical_between_models: true
  independently_optimized_secondary_comparison_cannot_satisfy_this_gate: true
  ranking_input: calibrated_probability
  raw_decision_score_role: within_origin_supporting_diagnostic
  probability_input: calibrated_probability
  pooled_requirements:
    average_precision_delta_must_be_positive: true
    user_gauc_event_weighted_delta_must_be_nonnegative: true
    calibrated_log_loss_delta_must_be_nonpositive: true
    calibrated_brier_delta_must_be_nonpositive: true
  daily_requirements:
    minimum_positive_average_precision_days: 5
    minimum_nonnegative_user_gauc_days: 5
    total_days: 7
  paired_user_cluster_bootstrap_requirement:
    average_precision_delta_95_percentile_CI_lower_must_be_positive: true
  failure_action:
    - retain_only_probability_repair_diagnostics
    - do_not_claim_stable_history_increment_from_v003
    - stop_before_sequence_models_or_validation

probability_diagnostics:
  pass_fail_role:
    log_loss_and_brier_vs_BL0: mandatory
    ECE20: descriptive_only
    calibration_intercept_and_slope: descriptive_only
    clip_and_extreme_share: descriptive_only
    roc_auc: descriptive_only
  required_per_model_origin_and_pooled:
    - observed_prevalence
    - mean_prediction
    - minimum_p001_p01_p10_median_p90_p99_p999_maximum
    - share_probability_le_1e_6
    - share_probability_ge_1_minus_1e_6
    - share_probability_le_0_01
    - share_probability_ge_0_99
    - log_loss
    - brier
    - ECE20_equal_width
    - assessment_calibration_intercept
    - assessment_calibration_slope
    - calibrated_average_precision
    - calibrated_user_gauc_event_weighted
    - calibrated_user_gauc_user_equal
    - raw_score_average_precision_within_origin
    - raw_score_user_gauc_event_weighted_within_origin
    - raw_score_user_gauc_user_equal_within_origin
  raw_score_field_applicability:
    scope_rule: raw_score_within_origin_fields_are_defined_only_for_per_origin_rows_and_are_not_pooled_across_origins
    BL0:
      status: not_applicable
      reason: constant_probability_reference_has_no_base_estimator_raw_decision_score
      affected_fields:
        - raw_score_average_precision_within_origin
        - raw_score_user_gauc_event_weighted_within_origin
        - raw_score_user_gauc_user_equal_within_origin
      required_recorded_value: null
    BL1_and_BL2:
      per_origin_rows: required_numeric_values
      pooled_rows:
        status: not_applicable
        reason: within_origin_raw_scores_do_not_have_a_registered_cross_origin_scale
        affected_fields:
          - raw_score_average_precision_within_origin
          - raw_score_user_gauc_event_weighted_within_origin
          - raw_score_user_gauc_user_equal_within_origin
        required_recorded_value: null
  ECE20:
    bins: 20
    binning: equal_width_on_0_1
    probability_one_in_last_bin: true
  assessment_calibration_regression:
    input: metric_clipped_logit_of_calibrated_probability
    target: official_long_view
    scope: frozen_daily_BL0_BL1_BL2_per_origin_plus_one_pooled_fit_per_model
    daily_origin_fits: 21
    pooled_fits: 3
    declared_slots: 24
    BL0_handling:
      status: not_applicable
      reason: >-
        BL0 emits one constant probability per origin, so the logit predictor has
        zero variance and no function of any form - linear, polynomial,
        exponential or otherwise - is determined by a single predictor value
      attempted_fits: 0
      recorded_intercept_and_slope: null
      rows_still_reported_for_coverage: true
    executed_fits:
      BL1_and_BL2_daily_origin_fits: 14
      BL1_and_BL2_pooled_fits: 2
      total_executed: 16
      declared_cap_unchanged: 24
    functional_form:
      parametric_fit: linear_in_the_logit
      implementation: sklearn_LogisticRegression
      solver: lbfgs
      penalty: "none"
      sklearn_1_9_no_penalty_representation:
        penalty_argument_must_be_omitted: true
        expected_get_params_penalty_sentinel: deprecated
        l1_ratio: 0.0
        C: numpy_positive_infinity
      tol: 0.0000000001
      max_iter: 1000
      fit_intercept: true
      class_weight: null
      sample_weight: null
      rationale: >-
        this diagnostic measures how far the assessment calibration slope departs
        from one; regularization would shrink the slope toward zero and conflict
        with that measurement purpose, while an unpenalized fit is the standard
        descriptive calibration-analysis convention
      parametric_fit_is_not_a_claim_that_miscalibration_is_linear: true
      nonparametric_companion: ECE20_equal_width_bins_in_calibration_bins_csv
      nonparametric_companion_role: >-
        the twenty binned pairs of mean predicted probability and observed rate
        expose miscalibration of any shape and may be inspected after the run
      additional_nonlinear_calibration_fit: not_registered_for_v003
      adding_one_after_seeing_results: forbidden
    search_candidate_assessment_calibration_regression: forbidden
    search_dates_are_included_only_through_their_frozen_daily_refits: true
    role: descriptive_only
  report_uncalibrated_and_calibrated_probability_metrics_side_by_side: true

discrimination_diagnostics:
