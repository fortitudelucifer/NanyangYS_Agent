    maximum_categories_per_input_field: 4096
    sparse_output: true
    output_dtype: float32
    raw_id_numeric_or_ordinal_use: forbidden
  continuous_and_rate:
    applies_to:
      - static_continuous_fields
      - H2_derived_continuous_or_rate_fields
    implementation: sklearn_StandardScaler
    with_mean: true
    with_std: true
    statistics_dtype: float64
    transformed_dtype: float32
