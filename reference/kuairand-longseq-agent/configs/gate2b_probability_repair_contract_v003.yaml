    penalty_omission_reason: sklearn_1_9_non_deprecated_API_uses_l1_ratio_zero_for_L2
    expected_get_params_penalty_sentinel: deprecated
    l1_ratio: 0.0
    C: 1.0
    dual: false
    fit_intercept: true
    intercept_scaling: 1
    class_weight: null
    random_state: null
    max_iter: 1000
    tol: 0.0000000001
    verbose: 0
    warm_start: false
    n_jobs: null
    input: base_estimator_raw_decision_score
    target: official_long_view
    sample_weight: null
  fit_scope: calibration_date_rows_only
  base_estimator_refit_after_calibration: forbidden
  calibration_on_clipped_probability: forbidden
  calibration_on_assessment_rows: forbidden
  calibration_on_future_rows: forbidden
  calibration_method_selection_from_metrics: forbidden
  required_fit_checks:
    both_classes_present: true
    raw_score_variance_strictly_positive: true
    convergence_warning_count: 0
    future_or_deprecation_warning_count: 0
