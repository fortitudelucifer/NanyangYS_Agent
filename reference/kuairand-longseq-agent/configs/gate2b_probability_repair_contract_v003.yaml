    remaining_reference_fits: 18
    diagnostic_calibration_regression_fits_using_primary_calibrator_time_proxy: 24
    fixed_nonfit_reserve_seconds: 600
    literal_coefficients_in_the_projection_formula: forbidden
    elapsed_projection_formula: preflight_elapsed + safety_multiplier * (max_preflight_SGD_seconds * remaining_SGD_fits + max_preflight_primary_calibrator_seconds * (remaining_primary_calibrator_fits + diagnostic_calibration_regression_fits_using_primary_calibrator_time_proxy) + max_preflight_reference_seconds * remaining_reference_fits) + fixed_nonfit_reserve_seconds
    projection_formula_coefficients_must_equal_declared_counts: true
    remaining_count_identity_required: remaining_equals_total_minus_preflight_for_every_component_type
    include_feature_loading_preprocessing_rule_diagnostics_bootstrap_and_report_in_fixed_reserve: true
    projected_total_elapsed_must_not_exceed_minutes: 120
    projected_peak_RAM_must_not_exceed_GB: 12
    projected_artifact_storage_must_not_exceed_GB: 20
  failure_action:
    - stop_before_remaining_search_fits
    - write_preflight_and_usage_ledgers
    - do_not_read_scientific_metrics
    - require_successor_contract_for_any_budget_or_parameter_change

operational_budget:
  budget_status: proposed_not_active
  scientific_configuration_definition: one_model_bundle_times_one_alpha_times_one_eta0
  primary_component_fit_definition: one_SGD_estimator_or_one_primary_calibrator_fit_for_one_origin
  reference_fit_definition: one_nonselectable_LogisticRegression_fit_for_one_model_bundle_alpha_and_origin_in_either_search_or_frozen_daily_stage
  diagnostic_fit_definition: one_assessment_calibration_regression_for_one_frozen_model_and_scope
  nonfitted_rule_evaluation_definition: one_fixed_history_score_for_one_origin
  accelerator: cpu_only
  gpu_device_hours: 0
  maximum_cpu_threads: 8
  SGD_estimator_threads: 1
  reference_solver_threads: 8
  primary_calibrator_threads: 8
  diagnostic_calibration_regression_threads: 8
  threadpool_limit_enforcement:
    implementation: threadpoolctl.threadpool_limits
    scope: every_individual_fit_operation
    user_APIs_covered: [blas, openmp]
    component_limits:
      SGD_estimator: 1
      diagnostic_reference_solver: 8
      primary_previous_day_sigmoid_calibrator: 8
      assessment_calibration_regression: 8
    limit_context_must_wrap_the_entire_fit_call: true
    observed_pool_capture_implementation: threadpoolctl.threadpool_info
    observed_inside_context: [immediately_before_fit, immediately_after_fit]
    any_observed_pool_num_threads_above_component_limit: fail_closed
    missing_threadpool_observation_for_an_executed_fit: fail_closed
    overlimit_fit_output_may_enter_objective_metric_gate_or_selection: false
  maximum_search_scientific_SGD_configurations: 8
  maximum_search_SGD_fit_runs: 24
  maximum_search_primary_calibrator_fit_runs: 24
  maximum_search_reference_solver_fit_runs: 12
  maximum_daily_reference_solver_fit_runs: 8
  reference_solver_scope: search_origins_at_all_alphas_plus_frozen_daily_origins_at_the_selected_alpha
  maximum_daily_SGD_fit_runs: 14
  maximum_daily_primary_calibrator_fit_runs: 14
  maximum_primary_component_fit_runs: 76
  maximum_reference_solver_fit_runs: 20
  maximum_diagnostic_calibration_regression_fits: 24
  maximum_nonfitted_history_rule_evaluations: 20
  reference_and_diagnostic_fits_are_separate_from_primary_component_cap: true
  all_fits_are_included_in_total_fit_operations: true
  nonfitted_rule_evaluations_are_not_fit_operations: true
  maximum_total_fit_operations: 120
  total_fit_operations_formula: 76_primary_plus_20_reference_plus_24_diagnostic
  runtime_preflight_extra_fit_operations: 0
  maximum_SGD_seconds_per_fit: 180
  maximum_reference_solver_seconds_per_fit: 600
  maximum_calibrator_seconds_per_fit: 120
  maximum_diagnostic_seconds_per_fit: 120
  maximum_elapsed_minutes: 120
  maximum_peak_ram_gb: 12
  maximum_artifact_storage_gb: 20
  overrun_tolerance: 0
  failed_and_nonconverged_fits_count_toward_caps: true
  planning_envelope_reconciliation:
    BL1_SGD_configurations: 4
    BL1_reference_alpha_configurations: 2
    BL1_total_search_linear_fit_runs: 18
    BL1_maximum_allowed_fit_runs_in_compute_search_budget_v002: 24
    BL2_SGD_configurations: 4
    BL2_reference_alpha_configurations: 2
    BL2_total_search_linear_fit_runs: 18
    BL2_maximum_allowed_fit_runs_in_compute_search_budget_v002: 36
    total_search_linear_fit_runs: 36
    total_search_fit_operations_including_calibrators: 60
    maximum_search_fit_runs_in_compute_search_budget_v002: 141
    frozen_daily_reference_solver_fit_runs: 8
    total_all_fit_operations: 120
    maximum_train_backtest_fit_runs_total_in_compute_search_budget_v002: 204
    within_frozen_planning_envelope: true
    elapsed_cap_unchanged_at_minutes: 120
    elapsed_cap_adjudicated_by_runtime_preflight_not_by_static_worst_case: true
  on_projected_or_actual_breach: stop_before_next_component_fit_and_write_usage_ledger
  budget_expansion_after_any_metric_read: forbidden
  expansion_requires:
    - successor_contract_version
    - complete_actual_usage_ledger
    - exact_requested_increment
    - explicit_project_owner_approval
    - confirmation_no_validation_restricted_test_or_random_metric_was_used
  exact_infrastructure_replacement:
    maximum_per_stage: 1
    scientific_configuration_must_be_identical: true
    no_metric_from_failed_attempt_may_be_used: true
    reason_and_evidence_must_be_logged: true

execution_environment:
  python_executable: ../.venv/Scripts/python.exe
  release_versions:
    python: 3.11.9
    scikit_learn: 1.9.0
    numpy: 2.4.6
    scipy: 1.17.1
    pyarrow: 25.0.1
    duckdb: 1.5.5
    threadpoolctl: 3.6.0
  exact_version_match_required: true
  environment_manifest_required: true
  estimator_get_params_snapshot_required: true
  reference_solver_get_params_snapshot_required: true
  calibrator_get_params_snapshot_required: true
  assessment_calibration_regression_get_params_snapshot_required: true
  silent_library_default_inheritance: forbidden
  code_config_input_and_output_SHA256_required: true

artifact_schemas:
  fit_threadpool_observation:
    required_for_every_executed_fit_operation: true
    measurement_moments: [inside_limit_context_immediately_before_fit, inside_limit_context_immediately_after_fit]
    observed_pool_entry_required_fields: [user_api, internal_api, prefix, filepath, version, num_threads]
    per_fit_required_fields:
      - threadpool_limit
      - observed_thread_pools_before_fit
      - observed_thread_pools_after_fit
      - maximum_observed_pool_threads
      - threadpool_limit_passed
    no_discovered_pool_representation: empty_list
    num_threads_must_be_a_positive_integer_when_a_pool_is_present: true
    maximum_observed_pool_threads_must_not_exceed_threadpool_limit: true
    overlimit_or_missing_observation_action: implementation_or_governance_failure
    overlimit_fit_output_may_enter_any_scientific_artifact_or_decision: false
  prediction_artifacts:
    identity_columns: [source_table, source_row_number, user_id, video_id, origin, long_view]
    common_columns: [prior_batch_n, p_BL0]
    per_SGD_model_columns:
      - pair_id
      - alpha
      - eta0
      - raw_decision_score
      - uncalibrated_probability
      - calibrated_probability
      - calibration_intercept
      - calibration_slope
    probability_and_parameter_nullability:
      default: every_probability_intercept_and_slope_value_must_be_finite_and_nonnull
      sole_exception:
        stage: search
        condition: primary_calibrator_nonconverged_and_trial_marked_ineligible
        nullable_fields: [calibrated_probability, calibration_intercept, calibration_slope]
        required_physical_value: Arrow_null
        NaN_or_infinity: forbidden
        may_enter_any_metric_gate_or_selection: false
      daily_or_eligible_search_trial_nulls: forbidden
    reference_column_naming: reference_raw_decision_score_{model_id}_{alpha_slug}
    reference_metadata_columns: [reference_model_id, reference_alpha, reference_C]
    reference_columns_scope: search_prediction_artifacts_only
    raw_decision_score_export_location: search_and_daily_prediction_artifacts
    search_fixed_rule_raw_score_columns:
      - fixed_rule_score_LIFETIME_SMOOTHED_RATE
      - fixed_rule_score_W10_SMOOTHED_RATE
  search_artifact_freeze_manifest:
    required_fields: [status, artifact_count, artifacts]
    required_status: frozen_before_any_derived_search_rule_or_candidate_assessment_metric
    required_artifact_count: 3
    artifact_entry_required_fields: [path, size_bytes, sha256]
    exact_paths:
      - search_predictions_origin_2022-04-11.parquet
      - search_predictions_origin_2022-04-14.parquet
      - search_predictions_origin_2022-04-17.parquet
    each_parquet_must_include_prediction_reference_and_both_fixed_rule_raw_score_columns: true
  search_trial_manifest:
    row_granularity: one_model_pair_origin_search_trial
    required_fields:
      - stage
      - origin
      - model_id
      - bundle
      - pair_id
      - alpha
      - eta0
      - fit_converged
      - calibrator_converged
      - optimization_adequate
      - eligible
      - ineligible_reason
    configuration_level_eligibility_may_be_repeated_on_each_origin_row: true
    every_frozen_search_trial_must_have_an_eligible_boolean_and_reason_if_false: true
  selected_models:
    required_fields:
      - eligible_configuration_count
      - paired_robustness_configuration_count
      - paired_robustness_ineligible_pairs
    eligible_configuration_count_definition: BL1_configurations_passing_every_shared_configuration_eligibility_condition
    paired_robustness_configuration_count_definition: pairs_with_complete_eligible_BL1_and_BL2_metrics_for_every_required_search_scope
    paired_robustness_ineligible_pairs_schema:
      type: list
      item_required_fields: [pair_id, reasons]
      reasons_must_be_nonempty: true
  get_params_snapshots:
    storage_location: run_manifest.json
    required_components:
