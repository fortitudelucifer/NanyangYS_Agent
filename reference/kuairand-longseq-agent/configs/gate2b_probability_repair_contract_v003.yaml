    entry_required_fields: [component_id, sklearn_class, get_params]
    get_params_must_be_the_fitted_or_instantiated_object_snapshot_not_a_handwritten_subset: true
    penalty_sentinel_and_inactive_parameters_must_be_retained: true
    exact_match_to_the_contract_declared_parameters_required: true
    active_release_failure_retention:
      every_snapshot_for_a_component_instantiated_or_fitted_before_failure_must_be_retained: true
      every_executed_assessment_calibration_regression_snapshot_must_be_retained: true
      a_not_executed_assessment_calibration_regression_slot_may_not_fabricate_a_snapshot: true
  coefficient_diagnostics:
