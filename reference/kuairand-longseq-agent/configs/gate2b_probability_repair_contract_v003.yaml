    - freeze_and_SHA256_the_three_search_prediction_parquets_before_any_derived_rule_metric_is_materialized
    - derive_the_six_per_origin_and_two_pooled_search_fixed_rule_metric_rows_only_from_the_frozen_parquet_vectors
    - compute_training_only_reference_objective_adequacy_for_all_configurations
    - materialize_all_search_assessment_metrics_in_one_batch
    - apply_BL1_eligibility_and_BL1_only_shared_configuration_selection
    - evaluate_same_configuration_primary_BL2_eligibility
    - write_all_pair_and_secondary_diagnostics
  BL1_metric_eligibility_and_selection_occur_only_after_all_search_outputs_are_frozen: true
