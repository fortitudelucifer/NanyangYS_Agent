design_revision_004:
  revised_at_local: "2026-08-15"
  stage: pre_execution_ambiguity_resolution_and_diagnostic_completion
  source: project_owner_decisions_on_four_flagged_ambiguities_before_any_v003_fit
  v003_fit_or_scientific_metric_observed_before_revision: false
  trigger: >-
    a mechanical field-coverage check of the contract against the implementation
    found declared diagnostics that were never implemented, and four clauses whose
    reading materially changes the reported result
  decisions:
    bootstrap_user_universe:
      question: is expected_users the target population or the assessment-date union
      measured_assessment_date_union: 943
      decision: use_943_the_actually_observed_assessment_date_union
      rationale: the_clustered_universe_must_be_the_set_that_is_verifiable_and_reproducible_at_any_time
      consequence: digest_recomputed_and_mismatch_now_stops_the_run
    assessment_calibration_regression_for_BL0:
      question: how to regress on a constant predictor
      decision: record_not_applicable_with_an_explicit_zero_variance_reason
      note: this_is_a_mathematical_fact_not_a_choice_of_functional_form
    nonlinear_calibration_diagnostic:
      question: should a nonlinear calibration fit be registered
      decision: not_registered_for_v003
      rationale: >-
        the twenty ECE bins already expose miscalibration of any shape, and
        choosing a functional form after seeing the residuals would be exactly the
        researcher degree of freedom this contract exists to remove
    daily_nonworse_baseline:
      question: is the daily non-worse count taken against the same-day BL0 or the pooled BL0
      decision: same_day_BL0_is_the_gate
      rationale: a_separate_pooled_requirements_block_already_covers_the_pooled_comparison
      pooled_baseline_count: reported_as_a_diagnostic_never_as_a_gate
      note: a_gate_must_have_exactly_one_definition_or_pass_and_fail_both_become_defensible
    evaluation_slice_scope:
      question: pooled only or per origin as well
      decision: both_scopes_retained_and_labelled
      rationale: slices_are_descriptive_only_so_retaining_both_costs_nothing_and_forecloses_nothing
    numerical_comparison_tolerance_direction:
      decision: unchanged
      note: the_1e_10_allowance_cannot_change_any_realistic_verdict
  implementation_gaps_closed:
    - assessment_calibration_regression_intercept_and_slope
    - raw_score_within_origin_average_precision_and_user_gauc
    - assessment_regret_diagnostics_in_the_objective_audit
    - contract_field_name_alignment_for_reported_metrics
    - field_coverage_guards_extended_to_probability_diagnostics_and_evaluation_slices
  deliberately_unchanged:
    - authorization_execution_authorized_remains_false
    - every_estimator_calibrator_and_reference_solver_parameter
    - the_population_temporal_protocol_and_feature_semantics
    - the_search_order_selection_rule_and_both_terminal_gates
  execution_effect: none_until_final_contract_hash_is_explicitly_approved

