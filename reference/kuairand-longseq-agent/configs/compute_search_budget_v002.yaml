    total_folds: 3
    pooled_train_rolling_origin_pr_auc_delta_must_be_positive: true
    pooled_user_gauc_delta_must_be_nonnegative: true
    probability_quality_direction_must_not_show_systematic_degradation: true
    not_a_confirmatory_sesoi_or_noninferiority_gate: true
    failure_action: stop_before_sequence_models_and_review_feature_time_sparse_and_confounding_definitions
  window_50_over_window_10_stability_gate:
