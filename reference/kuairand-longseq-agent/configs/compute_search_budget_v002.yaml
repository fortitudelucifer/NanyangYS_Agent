    pooled_daily_backtest_user_gauc_delta_must_be_nonnegative: true
    all_daily_effects_and_coverage_must_be_reported: true
    no_refreeze_or_tuning_between_daily_origins: true
    not_a_confirmatory_sesoi_or_noninferiority_gate: true
    failure_action: stop_before_validation_and_review_temporal_instability
  statistical_history_stability_gate:
    comparison: baseline_2_statistical_history_minus_baseline_1_static_no_history
