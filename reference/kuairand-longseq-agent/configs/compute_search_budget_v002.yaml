scientific_stop_rules:
  frozen_finalist_daily_stability_gate:
    comparison: frozen_candidate_minus_frozen_baseline
    source_train_origin_dates: ["2022-04-11", "2022-04-12", "2022-04-13", "2022-04-14", "2022-04-15", "2022-04-16", "2022-04-17"]
