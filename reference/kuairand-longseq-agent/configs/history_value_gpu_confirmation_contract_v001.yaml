  ADAM_BL2:
    bundle: history_bundle
    optimizer: GPU_ADAM
  SGD_BL1:
    bundle: static_bundle
    optimizer: GPU_SGD
  SGD_BL2:
    bundle: history_bundle
    optimizer: GPU_SGD
  mandatory_pairing:
    ADAM_BL2_minus_ADAM_BL1_is_the_Adam_history_effect: true
    SGD_BL2_minus_SGD_BL1_is_the_SGD_history_effect: true
    ADAM_BL1_minus_SGD_BL1_is_static_optimizer_diagnostic: true
    ADAM_BL2_minus_SGD_BL2_is_history_model_optimizer_diagnostic: true
    Adam_history_effect_minus_SGD_history_effect_is_optimizer_interaction: true
    cross_optimizer_BL2_comparison_cannot_replace_within_optimizer_history_effect: true

common_objective:
  model_family: sparse_linear_logistic_regression
  formula: mean_binary_log_loss_from_raw_score_plus_alpha_times_one_half_coefficient_L2_squared
  alpha: 0.0001
  intercept_regularized: false
  sample_weight: null
  class_weight: null
  fit_intercept: true
  full_batch: true
  coefficient_and_intercept_initialization: all_zero
  seed: 20260814
  deterministic_algorithms_required: true
  inherited_optimizer_defaults: forbidden

GPU_optimizers:
  GPU_ADAM:
    implementation: torch.optim.Adam
    torch_version_required: 2.11.0+cu128
    learning_rate: 0.03
    beta1: 0.9
    beta2: 0.999
    epsilon: 0.00000001
    weight_decay: 0.0
    amsgrad: false
    maximize: false
    capturable: false
    differentiable: false
    fused: false
    foreach: false
    candidate_step_checkpoints: [30, 100, 300, 1000]
    selection_rule: smallest_checkpoint_passing_adequacy_for_BL1_and_BL2_on_all_train_probe_origins
    starting_configuration_source: gate2b_gpu_experiment_v001
    failure_if_no_checkpoint_passes: optimizer_preflight_failure_requires_successor_contract
  GPU_SGD:
    implementation: torch.optim.SGD
    torch_version_required: 2.11.0+cu128
    learning_rate_candidates: [0.1, 0.03, 0.01, 0.003, 0.001]
    momentum: 0.0
    dampening: 0.0
    weight_decay: 0.0
    nesterov: false
    maximize: false
    differentiable: false
    foreach: false
    fused: false
    candidate_step_checkpoints: [100, 300, 1000, 3000]
    one_trajectory_per_learning_rate_with_checkpoint_reuse: true
    selection_rule:
      eligibility: pass_adequacy_for_BL1_and_BL2_on_all_train_probe_origins
      primary: smallest_step_checkpoint
      tie_break_order: [smallest_maximum_objective_regret, smaller_learning_rate]
      scientific_assessment_metric_use: forbidden
    failure_if_no_configuration_passes: optimizer_preflight_failure_requires_successor_contract
  shared_configuration_rules:
    BL1_and_BL2_must_share_the_same_optimizer_configuration_within_optimizer: true
    Adam_and_SGD_may_have_different_learning_rates_and_steps: true
    equal_compute_or_equal_step_count_required: false
    fairness_definition: same_objective_and_both_pass_the_same_optimization_adequacy_gate
    selected_configuration_frozen_before_validation_prediction: true
    optimizer_configuration_change_after_validation_metric_read: forbidden

optimizer_adequacy:
  role: mandatory_solver_health_gate_not_a_scientific_metric
  train_probe_origins: ["2022-04-11", "2022-04-14", "2022-04-17"]
  probe_fit_rule: standard_tab1_target_rows_strictly_before_origin_minus_one_calendar_day
  calibration_or_assessment_labels_used_for_selection: forbidden
  evaluated_on: estimator_fit_rows_only
  evaluation_dtype: float64
  reference_solver:
    implementation: sklearn_LogisticRegression_lbfgs
    input_matrix_and_column_order_identical_to_GPU_model: true
    input_dtype: float64
    C_formula: one_divided_by_fit_rows_times_alpha
    max_iter: 500
    tolerance: 0.00000001
    class_weight: null
    sample_weight: null
    convergence_required: true
    eligible_for_prediction_or_model_claim: false
  objective_regret:
    formula: GPU_objective_minus_reference_objective
    reference_must_not_exceed_GPU_objective_beyond_numerical_tolerance: true
    reference_above_GPU_numerical_tolerance: 0.0000000001
    maximum_allowed:
      absolute_floor: 0.0001
      relative_fraction: 0.005
      formula: max_absolute_floor_or_relative_fraction_times_absolute_reference_objective
  required_for_every_GPU_fit_used_for_validation_sealed_or_random:
    finite_coefficients_and_intercept: true
    finite_raw_scores_and_probabilities: true
    objective_regret_gate_pass: true
    terminal_gradient_norm_reported: true
    objective_trace_at_every_declared_checkpoint: true
  stage_rules:
    optimizer_preflight:
      all_declared_trajectories_are_completed_before_selection: true
      predictive_metric_materialization_or_read: forbidden
      selected_Adam_and_SGD_configuration_manifest_required: true
    validation_fit:
      selected_configuration_must_pass_on_BL1_and_BL2: true
      failure_action: stop_before_validation_metric_materialization
    sealed_refit:
      selected_configuration_must_pass_on_BL1_and_BL2: true
      failure_action: stop_before_sealed_prediction_or_metric_materialization
    metric_informed_tolerance_or_grid_change: forbidden

calibration:
  method_id: PREVIOUS_DAY_SIGMOID_V1
  implementation: sklearn_LogisticRegression_on_one_raw_decision_score
  method_search: forbidden
  input: GPU_base_estimator_raw_decision_score
  fit_intercept: true
  l1_ratio: 0.0
  C: 1.0
  solver: lbfgs
  max_iter: 1000
  tolerance: 0.0000000001
  class_weight: null
  sample_weight: null
  required_checks:
    both_classes_present: true
    raw_score_variance_strictly_positive: true
    convergence_warning_count: 0
    n_iter_strictly_less_than_max_iter: true
    finite_intercept_and_slope: true
    slope_strictly_positive: true
  probability_storage_clip: none
  metric_only_numerical_clip: [0.000000000000001, 0.999999999999999]
  assessment_or_future_calibration_fit: forbidden
  recalibration_inside_validation_sealed_or_random: forbidden

sequential_stage_protocol:
  stage_0_optimizer_preflight:
    data_scope: Train_only_2022_04_08_to_2022_04_17
    allowed_observations:
      - training_objective_trace
      - objective_regret_vs_reference
      - convergence_and_nonfinite_status
      - elapsed_time_memory_and_GPU_utilization
    forbidden_observations:
      - Validation_labels_predictions_or_metrics
      - sealed_labels_predictions_or_metrics
      - random_labels_predictions_or_metrics
      - predictive_metrics_used_for_optimizer_selection
    required_output: selected_optimizer_configuration_manifest.json
    completion_effect: >-
      automatically_unlock_validation_under_the_single_preapproved_final_contract_hash
      after_preflight_is_complete_hashed_and_adequate
  stage_1_validation:
    estimator_fit_dates_inclusive: ["2022-04-08", "2022-04-16"]
    calibration_date: "2022-04-17"
    target_dates_inclusive: ["2022-04-18", "2022-04-21"]
    target_source: canonical_early_standard_union
    target_filter: tab_equals_1
    expected_target_rows: 881035
    expected_target_rows_scope: all_matching_rows_before_warm_user_primary_gate_filter
    fit_encoder_scaler_and_smoothing_prior_on_estimator_rows_only: true
    frozen_model_weights_across_all_four_target_days: true
    frozen_calibrator_across_all_four_target_days: true
    online_standard_history_update: true
    target_day_model_or_calibrator_update: forbidden
    required_daily_results: 4
    metric_read_count: one_batched_release_after_all_predictions_are_hashed
    pass_effect: freeze_result_and_become_eligible_to_request_sealed_stage_unlock
    scientific_fail_or_optimizer_split_effect: >-
      freeze_the_falsifying_or_mixed_result_then_automatically_unlock_the_prespecified_sealed_stage;
      later_stages_may_characterize_temporal_heterogeneity_but_cannot_erase_this_result
    invalid_execution_effect: stop_and_require_repair_without_sealed_access
  stage_2_sealed_test:
    operational_name: sealed_test
    disclosure_name: partially_unblinded_restricted_confirmatory_test
    estimator_refit_dates_inclusive: ["2022-04-08", "2022-04-20"]
    calibration_date: "2022-04-21"
    target_dates_inclusive: ["2022-04-22", "2022-05-08"]
    target_source: canonical_late_standard_union
    target_filter: tab_equals_1
    expected_target_rows: 4404167
    expected_target_rows_scope: all_matching_rows_before_warm_user_primary_gate_filter
    refit_rule_was_frozen_before_validation_metric_read: true
    selected_optimizer_configurations_unchanged_from_validation: true
    feature_bundles_and_preprocessing_unchanged_from_validation: true
    frozen_model_weights_across_all_seventeen_target_days: true
    frozen_calibrator_across_all_seventeen_target_days: true
    online_standard_history_update: true
    target_day_model_or_calibrator_update: forbidden
    required_daily_results: 17
    one_prediction_and_metric_release_only: true
    rerun_after_metric_read: forbidden
    completion_effect_regardless_of_pass_or_fail: eligible_to_request_random_audit_unlock
  stage_3_random_audit:
    model_source: exact_frozen_stage_2_models_and_calibrators
    refit_or_recalibration: forbidden
    target_dates_inclusive: ["2022-04-22", "2022-05-08"]
    target_source: canonical_random_union
    target_filter: all_formal_random_exposures
    expected_target_rows: 43027
    expected_target_rows_scope: all_matching_rows_before_warm_user_primary_gate_filter
    history_source: standard_events_only
    random_event_history_update: forbidden
    target_label_use_for_prevalence_fit_calibration_or_threshold: forbidden
    one_prediction_and_metric_release_only: true
    role: exposure_distribution_transport_audit
    cannot_rescue_a_failed_standard_sealed_result: true
  stage_access_state_machine:
    initial_state: preflight_only
    transitions:
      - from: preflight_only
        to: validation_unlocked
        condition: >-
          preflight_complete_hashed_and_adequate_under_the_already_approved_final_contract_hash
      - from: validation_unlocked
        to: sealed_unlocked
        condition: >-
          validation_stage_complete_hashed_and_scientifically_interpretable_even_if
          its_history_gate_failed_or_only_one_optimizer_passed
      - from: sealed_unlocked
        to: random_unlocked
        condition: sealed_stage_complete_hashed_and_engineering_valid_regardless_of_scientific_gate_result
    out_of_order_access: terminal_governance_failure

evaluation:
  primary_metric:
    name: average_precision
    implementation: sklearn_average_precision_score
    aggregation: event_micro
    trapezoidal_PR_area: forbidden
    direction: higher_is_better
  secondary_metrics:
    user_gauc_event_weighted:
      eligibility: user_has_at_least_one_positive_and_one_negative
      ties: midrank
      weighting: eligible_event_count
      direction: higher_is_better
    user_gauc_user_equal:
      eligibility: identical_to_event_weighted
      weighting: equal_user
      direction: higher_is_better
    log_loss:
      direction: lower_is_better
    brier:
      direction: lower_is_better
    ece20_equal_width:
      bins: 20
      role: descriptive_only
    roc_auc:
      role: descriptive_only
  required_context_for_every_metric_table:
    - rows
    - users
    - positives
    - prevalence
    - eligible_user_and_row_coverage_for_user_gauc
  scopes:
    validation: [primary_warm_user_pooled_four_days, all_user_pooled_descriptive, each_day]
    sealed_test: [primary_warm_user_pooled_seventeen_days, all_user_pooled_descriptive, each_day]
    random_audit: [primary_warm_user_pooled, all_user_pooled_descriptive, each_day_descriptive_if_both_classes_present]
  required_slices:
    - all_target_rows
    - history_0_49
    - history_50_199
    - history_200_plus
    - history_500_plus_exploratory
    - warm_user
    - cold_user_if_present
    - warm_video
    - behavior_cold_video
    - tag_known
    - tag_unknown
    - video_duration_valid
    - video_duration_invalid
  slice_role: descriptive_only_unless_a_successor_contract_registers_a_slice_hypothesis
  cross_slice_raw_AP_comparison_without_prevalence_context: forbidden

bootstrap:
  cluster: user_id
  replicates: 2000
  seed: 20260814
  bit_generator: numpy_PCG64
  interval: percentile_2.5_97.5
  user_universe_by_stage: ascending_distinct_user_id_over_that_stage_target_manifest
  multiplicity_matrix_by_stage:
    generated_and_hashed_before_any_stage_metric: true
    dtype: little_endian_uint16
    exact_user_count_and_SHA256_recorded_in_stage_manifest: true
  shared_multiplicities_across_all_prediction_streams_and_contrasts: true
  each_selected_user_carries_all_of_their_dates_rows_labels_and_five_predictions: true
  recompute_nonlinear_metric_inside_each_replicate: true
  row_IID_bootstrap_or_standard_error: forbidden
  required_contrasts:
    - ADAM_BL1_minus_BL0
    - SGD_BL1_minus_BL0
    - ADAM_BL2_minus_ADAM_BL1
    - SGD_BL2_minus_SGD_BL1
    - ADAM_BL1_minus_SGD_BL1
    - ADAM_BL2_minus_SGD_BL2
    - Adam_history_effect_minus_SGD_history_effect
  metrics_for_model_contrasts:
    - average_precision
    - user_gauc_event_weighted
    - user_gauc_user_equal
    - log_loss
    - brier
  minimum_effective_replicates: 1950
  invalid_replicate_reason_counts_required: true

stage_gates:
  primary_gate_population_by_stage:
    validation: warm_user_rows
    sealed_test: warm_user_rows
    random_audit: warm_user_rows
    all_user_and_cold_user_results: descriptive_only
  common_static_baseline_gate_per_optimizer:
    comparison: optimizer_BL1_minus_BL0
    pooled_average_precision_CI_lower_must_be_positive: true
    pooled_user_gauc_event_weighted_delta_must_be_nonnegative: true
    pooled_log_loss_delta_must_be_nonpositive: true
    pooled_brier_delta_must_be_nonpositive: true
    purpose: ensure_BL1_is_an_effective_and_probability_sane_static_baseline
  common_absolute_probability_gate:
    applies_to_each_of: [ADAM_BL1, ADAM_BL2, SGD_BL1, SGD_BL2]
    pooled_log_loss_minus_BL0_must_be_nonpositive: true
    pooled_brier_minus_BL0_must_be_nonpositive: true
    numerical_tolerance: 0.0000000001
  common_history_gate_per_optimizer:
    comparison: optimizer_BL2_minus_same_optimizer_BL1
    pooled_average_precision_delta_minimum: 0.005
    pooled_average_precision_CI95_lower_must_be_positive: true
    pooled_user_gauc_event_weighted_delta_must_be_nonnegative: true
    pooled_log_loss_delta_must_be_nonpositive: true
    pooled_brier_delta_must_be_nonpositive: true
  validation_gate:
    static_and_absolute_gates_pass_for_both_optimizers: true
    history_gate_passes_for_both_optimizers: true
    minimum_positive_AP_days_per_optimizer: 3
    total_days: 4
    scientific_failure_action:
      - record_validation_failure_as_nonerasable_evidence
      - preserve_all_predictions_metrics_bootstrap_and_audits
      - automatically_continue_to_sealed_after_stage_freeze
      - prohibit_later_success_from_relabeling_validation_as_passed
    engineering_or_governance_failure_action: stop_before_sealed_access
  sealed_test_gate:
    static_and_absolute_gates_pass_for_both_optimizers: true
    history_gate_passes_for_both_optimizers: true
    minimum_positive_AP_days_per_optimizer: 12
    total_days: 17
    failure_does_not_prevent_prespecified_random_diagnostic_after_stage_completion: true
    failure_means_longer_horizon_standard_history_claim_is_falsified: true
  random_transport_gate:
    role: claim_scope_gate_not_a_rescue_gate
    history_gate_passes_for_both_optimizers: true
    daily_positive_count_not_a_gate_due_to_small_sparse_random_sample: true
    absolute_probability_vs_standard_BL0: descriptive_only_due_to_prevalence_shift
    failure_or_inconclusive_action: narrow_claim_to_standard_recommendation_exposure

probability_health:
  required_for_every_learned_stream_and_stage:
    finite_probability_share: 1.0
    probability_range_inclusive: [0.0, 1.0]
    share_at_or_below_1e_minus_6_reported: true
    share_at_or_above_1_minus_1e_minus_6_reported: true
    quantiles_required: [minimum, p001, p01, p10, median, p90, p99, p999, maximum]
    calibration_intercept_and_slope_reported: true
  hard_saturation_stop:
    lower_extreme_share_maximum: 0.05
    upper_extreme_share_maximum: 0.05
    threshold_epsilon: 0.000001
    rationale: prevent_recurrence_of_v002_clip_saturation

terminal_interpretation:
  validation_both_optimizers_pass:
    claim: short_horizon_out_of_time_validation_supports_history_increment_robust_to_optimizer_direction
    next_action: freeze_result_then_eligible_to_request_sealed_test_unlock
  validation_one_optimizer_only_passes:
    claim: history_increment_is_optimizer_dependent_or_inconclusive
    next_action: >-
      freeze_result_then_automatically_continue_to_sealed_for_prespecified
      temporal_heterogeneity_evidence_without_erasing_the_optimizer_split
  validation_both_fail:
    claim: broad_stable_history_increment_is_falsified_at_validation
    next_action: >-
      freeze_result_then_automatically_continue_to_sealed_for_prespecified
      temporal_heterogeneity_evidence_without_rescuing_the_broad_claim
  optimizer_adequacy_failure:
    scientific_claim: none
    interpretation: optimizer_implementation_did_not_form_a_valid_control
    next_action: successor_contract_required_without_validation_access
  sealed_both_optimizers_pass:
    claim: longer_horizon_standard_exposure_supports_history_increment_robust_to_optimizer_direction
    next_action: complete_random_transport_audit
  sealed_one_or_both_fail:
    claim: longer_horizon_standard_history_increment_is_falsified_or_optimizer_dependent
    next_action: random_audit_may_only_localize_transport_behavior_and_cannot_rescue_claim
  random_both_optimizers_pass:
    claim: history_increment_transports_to_the_frozen_random_exposure_audit_under_both_optimizers
  random_inconclusive_or_fail:
    claim: history_evidence_is_limited_to_standard_recommendation_exposure_or_random_power_is_insufficient_as_reported
  mixed_stage_results:
    validation_fail_later_pass:
      claim: history_increment_is_time_dependent_and_failed_the_short_horizon_validation_stage
      forbidden_reinterpretation: later_success_confirms_the_original_cross_stage_stability_claim
    validation_pass_sealed_fail:
      claim: history_increment_did_not_persist_to_the_longer_horizon_standard_test
    standard_pass_random_fail:
      claim: history_increment_is_supported_for_standard_exposure_but_not_shown_to_transport_to_random_exposure
  strongest_permitted_final_claim:
    requires: [validation_both_pass, sealed_both_pass, random_both_pass]
    wording: >-
      Under the frozen offline candidate-response protocol, strict point-in-time
      user history improves over the identical static baseline on temporally later
      standard exposures and the frozen random-exposure audit under both GPU Adam
      and GPU SGD.
  always_forbidden:
    - prove_history_is_causally_useful
    - claim_online_business_lift
    - claim_full_catalog_recommendation_quality
    - call_partially_unblinded_test_pristine
    - use_random_success_to_override_standard_test_failure
    - use_sealed_or_random_success_to_erase_a_validation_failure
    - select_only_the_better_optimizer_after_stage_metric_read

