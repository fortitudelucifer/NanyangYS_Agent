feature_bundles:
  static_bundle:
    bundle_id: S_ID_CONTENT_V1_with_PIT_GROUPED_SCALE_V2
    categorical_tokens:
      - user_id_controlled_category
      - video_id_controlled_category
      - author_id_controlled_category
      - music_id_controlled_category
      - video_type_category
      - upload_type_category
      - music_type_category
      - tag_clean_combination_category
      - video_duration_bucket_category
    continuous_fields:
      - log1p_video_duration_seconds
      - log1p_nonnegative_upload_age_days
      - log1p_server_width
      - log1p_server_height
      - clipped_aspect_ratio
    binary_fields:
      - video_duration_valid
      - upload_age_valid
      - upload_date_future_or_invalid
      - geometry_valid
      - tag_missing
  history_bundle:
    bundle_id: H2_USER_STRICT_V1_with_PIT_GROUPED_SCALE_V2
    inherits_exact_static_bundle: true
    completed_user_timestamp_windows: [10, 50, 200]
    fields_per_window:
      - event_count
      - positive_count
      - smoothed_long_view_rate
      - full_window_mask
    lifetime_fields:
      - prior_batch_count
      - prior_event_count
      - prior_positive_count
      - smoothed_long_view_rate
      - has_history
      - last_batch_gap_seconds
    smoothing:
      prior_probability: estimator_fit_target_prevalence
      prior_strength: 20.0
      assessment_or_future_fit: forbidden
  preprocessing:
    categorical:
      implementation: sklearn_OneHotEncoder
      fit_scope: estimator_fit_rows_only
      handle_unknown: infrequent_if_exist
      minimum_frequency: 20
      maximum_categories_per_input_field: 4096
      output_dtype: float32
      raw_ID_numeric_or_ordinal_use: forbidden
    continuous_and_rate:
      implementation: sklearn_StandardScaler
      fit_scope: estimator_fit_rows_only
      with_mean: true
      with_std: true
      transformed_clip: [-10.0, 10.0]
      transformed_dtype: float32
    binary:
      implementation: passthrough
      allowed_values: [0.0, 1.0]
      standardization: forbidden
      output_dtype: float32
    assembly:
      format: scipy_CSR_then_torch_sparse_CSR_CUDA
      dtype: float32
      row_normalization: none
    nested_invariants:
      BL1_and_BL2_share_the_same_fitted_static_encoder_and_scaler: true
      BL1_matrix_is_an_exact_column_prefix_of_BL2: true
      row_order_and_identity_identical_across_all_five_prediction_streams: true
      calibration_and_target_column_order_match_fit: true
  hard_predictor_denylist:
    - current_or_future_long_view
    - is_click
    - is_like
    - is_follow
    - is_comment
    - is_forward
    - is_hate
    - play_time_ms
    - profile_stay_time
    - comment_stay_time
    - is_profile_enter
    - source_table
    - source_row_number
    - event_date
    - time_ms
    - tab
    - exclusion_reason
    - quality_or_audit_fields
    - formula_recalculation_fields
    - video_statistic_fields
    - content_modality_proxy
    - visible_status
    - user_snapshot_fields
  forbidden_feature_changes_after_contract_hash_approval:
    - adding_or_removing_any_BL1_static_field
    - adding_or_removing_any_BL2_history_field
    - changing_window_lengths
    - changing_smoothing_strength
    - changing_unknown_or_missing_value_semantics
    - using_random_or_sealed_metrics_for_feature_selection

