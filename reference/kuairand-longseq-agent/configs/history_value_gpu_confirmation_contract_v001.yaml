research_hypotheses:
  estimand_definition:
    within_optimizer_history_effect: metric_BL2_minus_metric_BL1_on_identical_rows
    Adam_history_effect_symbol: H_Adam
    SGD_history_effect_symbol: H_SGD
    optimizer_history_interaction_symbol: H_Adam_minus_H_SGD
    loss_metric_sign_convention: negative_is_improvement
    ranking_metric_sign_convention: positive_is_improvement
  primary_null: >-
    At least one of GPU Adam or GPU SGD fails to show the preregistered practical
    and user-cluster-supported BL2-over-BL1 history increment on the current
    standard-exposure confirmation stage.
  primary_alternative: >-
    Both GPU Adam and GPU SGD show the preregistered practical and
    user-cluster-supported BL2-over-BL1 history increment on the current
    standard-exposure confirmation stage.
  intersection_union_rule:
    both_optimizer_specific_history_gates_must_pass: true
    selecting_only_the_better_optimizer_after_metric_read: forbidden
    multiplicity_adjustment_for_the_conjunction: not_required_for_the_intersection_union_claim
    rationale: >-
      The robust claim is accepted only when both optimizer-specific null
      components are rejected at the declared level; success of either one alone
      cannot satisfy the conjunction.
  minimum_effect_size:
    metric: average_precision
    absolute_delta: 0.005
    status: frozen_before_validation_metric_access
    interpretation: minimum_practical_increment_not_a_p_value_threshold
  optimizer_interaction:
    role: secondary_prespecified_robustness_analysis
    formula: H_Adam_minus_H_SGD
    bootstrap_CI_required: true
    direction_robustness_requires_both_optimizer_history_gates: true
    magnitude_equivalence_margin: [-0.005, 0.005]
    comparable_magnitude_claim_requires_CI_entirely_inside_margin: true
    failure_of_equivalence_does_not_negate_both_positive_history_effects: true

