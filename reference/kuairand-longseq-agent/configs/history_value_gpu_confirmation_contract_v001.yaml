design_intent:
  sole_scientific_question: >-
    Does the frozen strict point-in-time user-history bundle H2 improve candidate
    long_view prediction over the identical static feature baseline BL1 on
    temporally subsequent standard exposure data, and is that conclusion robust
    to GPU Adam versus GPU SGD optimization?
  task: candidate_long_view_probability_prediction
  primary_label: official_long_view
  target_scene_for_standard_exposure: tab_equals_1
  history_scene_scope: all_standard_tabs
  feature_hypothesis:
    baseline: S_ID_CONTENT_V1_with_PIT_GROUPED_SCALE_V2
    candidate: H2_USER_STRICT_V1_with_PIT_GROUPED_SCALE_V2
    sole_difference: strict_user_history_fields
  deliberately_out_of_scope:
    - history_window_selection_or_ablation
    - H3_user_content_or_user_tag_interactions
    - sequence_or_neural_models
    - tree_models
    - feature_discovery_or_feature_selection
    - threshold_or_calibration_method_search
    - candidate_generation_or_full_catalog_recommendation
    - online_causal_or_business_lift_claims
    - CPU_GPU_speed_or_throughput_comparison

authorization:
  contract_creation_authorized: true
  creation_source: >-
    project_owner_request_on_2026_08_23_to_write_a_detailed_GPU_contract_for_the
    sole_history_value_question_using_validation_then_sealed_test_then_random_audit
    with_Adam_and_SGD_controls
  execution_authorized: false
  data_access_authorized_by_this_draft: false
  approval_receipt_protocol:
    path: configs/history_value_gpu_confirmation_approval_v001.json
    created_only_after_project_owner_approves_exact_final_contract_SHA256: true
    receipt_creation_does_not_mutate_or_rehash_the_frozen_contract: true
    runner_requires_contract_id_exact_SHA256_execution_true_and_automatic_transitions_true: true
    current_receipt_status: absent_pending_project_owner_exact_hash_approval
  exact_hash_approval_required_after_implementation: true
  required_before_any_validation_model_fit_or_prediction:
    - project_owner_explicit_approval_of_the_final_contract_SHA256
    - implementation_runner_and_tests_complete
    - implementation_file_SHA256_values_pinned_in_a_successor_revision
    - synthetic_end_to_end_tests_pass_without_governed_split_access
    - validate_only_checks_pass_without_scientific_metric_materialization
    - governed_data_access_unlock_is_scoped_to_the_current_stage_only
    - optimizer_adequacy_selection_protocol_is_implemented_exactly
    - partial_unblinding_status_is_disclosed_in_the_report_template
  required_before_sealed_test_access:
    - validation_stage_is_complete_and_hashed
    - validation_scientific_gate_result_is_frozen_even_if_pass_fail_or_optimizer_split
    - validation_engineering_and_governance_checks_completed_without_invalidating_failure
    - sealed_stage_code_config_and_report_template_were_frozen_before_validation_metric_read
  required_before_random_audit_access:
    - sealed_stage_is_complete_and_hashed_regardless_of_pass_or_fail
    - random_stage_code_config_and_report_template_were_frozen_before_validation_metric_read
  stage_transition_policy: >-
    one_explicit_approval_of_the_final_contract_hash_authorizes_automatic_ordered
    transitions_after_each_prior_stage_is_complete_hashed_and_engineering_valid;
    scientific_gate_failure_does_not_pause_or_require_new_approval

