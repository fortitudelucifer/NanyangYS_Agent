  SGD_status: frozen_engineering_appendix_not_a_prediction_stream_or_gate

research_hypotheses:
  estimand_definition:
    primary_history_effect: metric_ADAM_BL2_minus_metric_ADAM_BL1_on_identical_rows
    loss_metric_sign_convention: negative_is_improvement
    ranking_metric_sign_convention: positive_is_improvement
  primary_null: Adam_BL2_fails_the_preregistered_history_increment_gate
  primary_alternative: Adam_BL2_passes_the_preregistered_history_increment_gate
  intersection_union_rule:
    status: removed_with_SGD_freeze
  optimizer_interaction:
    status: deferred_not_computed

