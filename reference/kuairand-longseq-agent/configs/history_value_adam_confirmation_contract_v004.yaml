bootstrap:
  required_contrasts:
    - ADAM_BL1_minus_BL0
    - ADAM_BL2_minus_ADAM_BL1

stage_gates:
  common_static_baseline_gate:
    comparison: ADAM_BL1_minus_BL0
    pooled_average_precision_CI_lower_must_be_positive: true
    pooled_user_gauc_event_weighted_delta_must_be_nonnegative: true
    pooled_log_loss_delta_must_be_nonpositive: true
    pooled_brier_delta_must_be_nonpositive: true
  common_history_gate:
    comparison: ADAM_BL2_minus_ADAM_BL1
    pooled_average_precision_delta_minimum: 0.005
    pooled_average_precision_CI95_lower_must_be_positive: true
    pooled_user_gauc_event_weighted_delta_must_be_nonnegative: true
    pooled_log_loss_delta_must_be_nonpositive: true
    pooled_brier_delta_must_be_nonpositive: true
  validation_gate:
    static_absolute_and_history_gates_pass_for_Adam: true
    minimum_positive_AP_days: 3
    total_days: 4
    scientific_failure_still_continues_to_sealed: true
  sealed_test_gate:
    static_absolute_and_history_gates_pass_for_Adam: true
    minimum_positive_AP_days: 12
    total_days: 17
    scientific_failure_still_continues_to_random: true
  random_transport_gate:
